# Backstop for one runaway worker (2026-10-05). The 15-minute recycle timer
# (opencaselaw-worker-recycle) restarts a worker gracefully above 3.5 GB; this
# cap only catches one that grows faster than that. Above it the kernel kills
# the worker and Restart=always brings it back in 5 s.
#
# Deliberately no MemoryHigh: for anonymous memory it throttles instead of
# freeing, and a throttled worker stalls for hours (the 2026-09-07/08
# structure-extractor incident) while still holding its memory.
[Service]
MemoryMax=8G
