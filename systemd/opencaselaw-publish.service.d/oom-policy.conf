# Turn a runaway build step into a killed step, never a wedge (2026-09-08).
#
# The unit caps its cgroup with MemoryHigh=32G, which throttles instead of
# killing. That is right for page cache (reclaimable) and wrong for anonymous
# memory: on 2026-09-07/08 the served-text structure extractor grew to 34-36 GB
# of unswappable RSS, sat above MemoryHigh in D state
# (wchan mem_cgroup_handle_over_high, 1.7M memory.high events) for hours,
# evicted the serving page cache (44 GB -> 14 GB on the 61 GB box) and every
# search timed out at nginx - once under each publish unit.
#
# MemoryMax one GiB above MemoryHigh: file pages are simply reclaimed at the
# cap; a step whose anonymous memory crosses it is OOM-killed inside the
# cgroup within minutes of passing MemoryHigh instead of throttling for hours.
# OOMPolicy=continue keeps the unit's main process alive when the kernel kills
# one child; the default OOMPolicy=stop would tear down the whole run. With
# continue the step fails and the orchestrator takes its fallback (publish.py
# step 2g -> shard build; incremental_nightly.py -> failed step, summary
# written, OnFailure alert). The OOM killer picks the largest process, i.e.
# the runaway child, never the orchestrator.
#
# Apply: copy to /etc/systemd/system/opencaselaw-publish.service.d/ on the VPS,
# then `systemctl daemon-reload` (cgroup limits apply to a running unit at
# once). Verify:
#   systemctl show opencaselaw-publish.service -p MemoryHigh -p MemoryMax -p OOMPolicy
[Service]
MemoryMax=33G
OOMPolicy=continue
