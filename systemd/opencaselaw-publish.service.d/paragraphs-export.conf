# After every successful build, start the weekly paragraphs export
# (opencaselaw-paragraphs-export.service decides whether one is due).
# A failed build starts nothing; the next successful one catches up.
#
# Apply: cp to /etc/systemd/system/opencaselaw-publish.service.d/, then
# `systemctl daemon-reload`. Takes effect when the running build exits.
[Unit]
OnSuccess=opencaselaw-paragraphs-export.service
