# /etc/systemd/system/opencaselaw-cantonal.service.d/build-regardless.conf
#
# 2026-09-03: on 09-02 zh.ch answered four detail pages with 500, the scraper
# exited 1 and the `&&` chain skipped the DB rebuild for all 26 cantons, so
# the served cantonal_laws.db stayed on its 08-19 build for another month.
#
# One canton's portal outage must not cost the others their refresh:
#   1. the scrape's exit status is ignored ('-'); with the promote-on-success
#      scraper every canton's shard on disk is either fresh or the previous
#      good snapshot, never a truncated one;
#   2. the LexFind harvest refreshes JU, SZ, VD (no portal scraper) and ZH
#      (portal holds a fraction of the collection). Its exit status is
#      ignored too and `timeout` keeps it from eating the build's window:
#      a killed run leaves the previous shards, it writes no report;
#   3. the build runs on whatever is in place (same arguments as before);
#   4. the last steps turn the unit red if the scrape or the harvest left a
#      canton un-refreshed (exit 1) or never finished (no fresh report,
#      exit 2), so the failure stays visible in `systemctl status` — after
#      the DB has been rebuilt, not instead of it.
#
# Apply AFTER the scraper change is deployed (the third step needs the
# --check-report flag):  systemctl daemon-reload && systemctl cat opencaselaw-cantonal.service
[Service]
ExecStart=
ExecStart=-/usr/bin/python3 scrape_cantonal_laws.py --output /mnt/HC_Volume_104655575/output/cantonal_laws_direct
ExecStart=-/usr/bin/timeout 5400 /usr/bin/python3 -m scrapers.lexfind_cantonal --delay 1 --canton JU --canton SZ --canton VD --canton ZH
ExecStart=/usr/bin/python3 -m search_stack.build_cantonal_laws_db --input-direct /mnt/HC_Volume_104655575/output/cantonal_laws_direct --input-lexfind /opt/caselaw/repo/output/lexfind_cantonal --output /mnt/HC_Volume_104655575/output/cantonal_laws.db
ExecStart=/usr/bin/python3 scrape_cantonal_laws.py --check-report /mnt/HC_Volume_104655575/output/cantonal_laws_direct
ExecStart=/usr/bin/python3 -m scrapers.lexfind_cantonal --check-report /opt/caselaw/repo/output/lexfind_cantonal
