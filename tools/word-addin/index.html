<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenCaseLaw</title>

  <!-- Office.js from CDN -->
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>

  <!-- Pre-paint locale shim. Runs synchronously before any layout so
       the static brand-sub / placeholder / loading text appear in the
       user's language from frame 1, not after the 100-300 ms FOIT
       when app.js initialises. Safe defaults: every branch falls back
       to the existing German strings if anything goes wrong. -->
  <script>
  (function () {
    try {
      var stored = null;
      try { stored = localStorage.getItem('ocl_lang'); } catch (e) {}
      var raw = (stored ||
                 (typeof navigator !== 'undefined' && (navigator.language ||
                  (navigator.languages && navigator.languages[0]))) ||
                 'de').toLowerCase();
      var lang = raw.indexOf('fr') === 0 ? 'fr' :
                 raw.indexOf('it') === 0 ? 'it' :
                 raw.indexOf('en') === 0 ? 'en' :
                 raw.indexOf('de') === 0 ? 'de' : 'de';
      var STR = {
        de: { brand: 'Schweizer Rechtsprechung',
              placeholder: 'Entscheide, Gesetze, Doktrin suchen...',
              loading: 'Wird geladen...',
              gear: 'Einstellungen',
              langLabel: 'Sprache' },
        fr: { brand: 'Jurisprudence suisse',
              placeholder: 'Rechercher décisions, lois, doctrine...',
              loading: 'Chargement...',
              gear: 'Paramètres',
              langLabel: 'Langue' },
        it: { brand: 'Giurisprudenza svizzera',
              placeholder: 'Cerca decisioni, leggi, dottrina...',
              loading: 'Caricamento...',
              gear: 'Impostazioni',
              langLabel: 'Lingua' },
        en: { brand: 'Swiss Case Law',
              placeholder: 'Search decisions, statutes, doctrine...',
              loading: 'Loading...',
              gear: 'Settings',
              langLabel: 'Language' },
      };
      document.documentElement.lang = lang;
      function apply() {
        var s = STR[lang];
        var b = document.getElementById('brand-sub'); if (b) b.textContent = s.brand;
        var i = document.getElementById('search-input-fallback'); if (i) i.placeholder = s.placeholder;
        var m = document.getElementById('init-msg'); if (m) m.textContent = s.loading;
        var g = document.getElementById('btn-settings');
        if (g) { g.title = s.gear; g.setAttribute('aria-label', s.gear); }
        var ls = document.getElementById('lang-select');
        if (ls) { ls.setAttribute('aria-label', s.langLabel); ls.value = lang; }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', apply);
      } else {
        apply();
      }
    } catch (e) { /* fail open — German fallback already in markup */ }
  })();
  </script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css?v=36" />
</head>
<body>

  <header class="header">
    <div class="header-left">
      <div class="logo" aria-label="OpenCaseLaw">O</div>
      <span class="brand">OpenCaseLaw</span>
      <span class="brand-sub" id="brand-sub">Schweizer Rechtsprechung</span>
    </div>
    <div class="header-right">
      <select id="lang-select" class="lang-select" aria-label="Sprache">
        <option value="de" selected>DE</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
        <option value="en">EN</option>
      </select>
      <button id="btn-settings" class="btn-icon" aria-label="Einstellungen" title="Einstellungen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="app">
    <input class="search-bar" id="search-input-fallback" type="text"
           placeholder="Entscheide, Gesetze, Doktrin suchen..."
           style="margin-top:8px;">
    <div class="state-message" id="init-msg" style="margin-top:24px;">Wird geladen...</div>
  </main>

  <!-- Polite live region for screen readers — render() pushes status
       changes (loading, result count, errors, no-results) here so AT
       users get the same dynamic feedback sighted users see in the panel. -->
  <div id="a11y-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Scripts (order matters) -->
  <script src="js/i18n.js?v=40"></script>
  <script src="js/citation.js?v=35"></script>
  <script src="js/redact.js?v=36"></script>
  <script src="js/api.js?v=42"></script>
  <script src="js/word-api.js?v=35"></script>
  <script src="js/verify.js?v=35"></script>
  <script src="js/app.js?v=50"></script>

</body>
</html>
