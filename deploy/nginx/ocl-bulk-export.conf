# Per-IP budget for the expensive per-decision export renderers.
#
# This public template documents the active control without publishing client
# identifiers, traffic volumes, or behavioural analysis. Calibration evidence
# belongs in the private operations workspace.
#
# The burst allows ordinary one-off bibliography exports. Sustained bulk
# retrieval is directed to the single-download CC0 mirror advertised by the
# response headers in `mcp-server`.
limit_req_zone $binary_remote_addr zone=ocl_export:10m rate=10r/m;
