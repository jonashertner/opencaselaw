# Harvest guard for the export renderers — per-network budget + auto-ban.
# Included from the http{} block (Ubuntu: every conf.d/*.conf is).
#
# WHY
# ---
# ocl-bulk-export.conf meters exports per IP address. A fleet that spreads
# over dozens of addresses in one provider's range gets one budget per
# address and passes it untouched: on 2026-10-23 a 50-address fleet pulled
# ~12,900 export renders per 15 minutes for six hours, which bloated the MCP
# workers, starved the nightly build of page cache and timed out its QC gate.
#
# Two layers, both scoped to /api/decisions/<id>/export* only (the JSON API,
# /entscheid/ pages and the MCP surface are untouched):
#
#   1. ocl_export_net — the same kind of budget, keyed on the network
#      (IPv4 /24, IPv6 /48 where the address is written in full form; any
#      other address falls back to itself). Measured over four days of
#      tier1.log: the 99.9th percentile of export requests per /24 per
#      15 minutes is 24, so 30 r/m with a burst of 60 is never felt by an
#      office sharing one egress range.
#
#   2. $ocl_harvest_ban — networks that scripts/autoban_harvesters.py has
#      banned for a while (default 24 h). The generated list lives in a
#      host-local snippet: it holds client networks, so it is never
#      committed. The file must exist (an empty one is fine) or nginx -t
#      fails; the runbook's install step creates it.
#
# See runbooks/harvest_autoban.md.

map $remote_addr $ocl_net {
    "~^(\d+\.\d+\.\d+)\.\d+$"                 $1;
    "~^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+):[0-9a-f]" $1;
    default                                  $remote_addr;
}

limit_req_zone $ocl_net zone=ocl_export_net:10m rate=30r/m;

geo $ocl_harvest_ban {
    default 0;
    include /etc/nginx/snippets/ocl-autoban.geo;
}
