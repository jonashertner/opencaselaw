[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencaselaw-cli"
dynamic = ["version"]
description = "Composable, read-only research client for OpenCaseLaw"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["swiss law", "case law", "citations", "legal research", "cli", "opencaselaw", "bundesgericht", "bge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

[project.optional-dependencies]
pdf = ["pypdf>=4,<7"]   # `ocl check` on PDF submissions; without it, pdftotext (poppler) on PATH is used

[project.urls]
Homepage = "https://opencaselaw.ch/cli/"
Documentation = "https://opencaselaw.ch/research-cli.md"
Source = "https://github.com/jonashertner/opencaselaw/tree/main/clients/python"
Changelog = "https://github.com/jonashertner/opencaselaw/blob/main/clients/python/CHANGELOG.md"
Issues = "https://github.com/jonashertner/opencaselaw/issues"
"Agent guide" = "https://github.com/jonashertner/opencaselaw/blob/main/clients/python/src/opencaselaw_cli/AGENTS.md"
LinkedIn = "https://www.linkedin.com/company/opencaselaw-ch/"

[project.scripts]
ocl = "opencaselaw_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencaselaw_cli = ["AGENTS.md", "skills/*/SKILL.md"]

[tool.setuptools.dynamic]
version = {attr = "opencaselaw_cli._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
