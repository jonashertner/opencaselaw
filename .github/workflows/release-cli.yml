name: Publish opencaselaw-cli

# Publishes the standalone research client (clients/python) to PyPI with
# trusted publishing. Nothing is uploaded until the PyPI project
# `opencaselaw-cli` lists this repository + workflow + environment as a
# trusted publisher (Jonas's PyPI account) and a `cli-v*` tag is pushed.
# The root package keeps its own `v*` tags and release.yml.

on:
  push:
    tags:
      - "cli-v*"

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify tag matches the client version
        run: |
          python - <<'PY'
          import os, pathlib, re
          tag = os.environ["GITHUB_REF_NAME"]
          source = pathlib.Path("clients/python/src/opencaselaw_cli/_version.py").read_text()
          version = re.search(r'__version__\s*=\s*"([^"]+)"', source).group(1)
          expected = f"cli-v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag} does not match clients/python version {version} (expected {expected})")
          print("tag matches version", version)
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check "build==1.2.2" "twine==7.0.0"
          python -m build --outdir dist clients/python
          python -m twine check dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/ocl-smoke
          /tmp/ocl-smoke/bin/pip install --disable-pip-version-check --no-deps dist/*.whl
          /tmp/ocl-smoke/bin/ocl --version
          /tmp/ocl-smoke/bin/ocl --help > /dev/null
          /tmp/ocl-smoke/bin/python -c "import opencaselaw_cli, opencaselaw_cli.render, opencaselaw_cli.workflows"

      - name: Run the client tests against the built wheel
        run: |
          /tmp/ocl-smoke/bin/pip install --disable-pip-version-check pytest
          /tmp/ocl-smoke/bin/python -m pytest -q clients/python/tests -p no:cacheprovider

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opencaselaw-cli-distributions
          path: dist/

  publish:
    name: Publish to PyPI with trusted publishing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-cli
      url: https://pypi.org/p/opencaselaw-cli
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: opencaselaw-cli-distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
