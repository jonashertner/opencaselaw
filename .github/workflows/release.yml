name: Publish Python package

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build immutable distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      wheel_sha256: ${{ steps.hashes.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.hashes.outputs.sdist_sha256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}")
          PY

      - name: Install hash-pinned build toolchain
        run: |
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes \
            -r .github/release-build-requirements.txt

      - name: Build distributions without dependency resolution
        run: python -m build --no-isolation

      - name: Validate artifact contents
        id: hashes
        run: |
          python - <<'PY'
          import email.parser
          import hashlib
          import os
          import pathlib
          import tarfile
          import tomllib
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("swiss_caselaw_scrapers-*.whl"))
          sdists = list(dist.glob("swiss_caselaw_scrapers-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist; got {wheels=} {sdists=}")

          config = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          configured_modules = config["tool"]["setuptools"]["py-modules"]
          required = (
              "scrapers/",
              "search_stack/",
              "quality/",
              "web_api/",
              "study/",
              *(f"{module}.py" for module in configured_modules),
          )
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              missing = [item for item in required if not any(name == item or name.startswith(item) for name in names)]
              if missing:
                  raise SystemExit(f"wheel is missing required content: {missing}")
              metadata_path = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = email.parser.Parser().parsestr(archive.read(metadata_path).decode())
              expected_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              if metadata["Name"] != "swiss-caselaw-scrapers" or metadata["Version"] != expected_version:
                  raise SystemExit(f"unexpected wheel identity: {metadata['Name']} {metadata['Version']}")

          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
              forbidden = ("/.env", "/credentials", "/secret", ".pem", ".key")
              exposed = [name for name in names if any(marker in name.lower() for marker in forbidden)]
              if exposed:
                  raise SystemExit(f"sdist contains sensitive-looking paths: {exposed}")

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          wheel_hash = digest(wheels[0])
          sdist_hash = digest(sdists[0])
          print(f"{wheel_hash}  {wheels[0].name}")
          print(f"{sdist_hash}  {sdists[0].name}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"wheel_sha256={wheel_hash}\n")
              output.write(f"sdist_sha256={sdist_hash}\n")
          PY

      - name: Upload immutable distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Run offline source tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Run offline release tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt \
            "pytest==9.0.3" "pytest-asyncio==1.3.0" \
            "openai>=1.40" "anthropic>=0.40" "google-genai>=0.3" "openapi-spec-validator>=0.7"
          pytest -q \
            --ignore=test_bger_live.py \
            --ignore=test_federal_live.py \
            --ignore=test_build_vectors.py \
            --ignore=test_appeal_chain.py \
            --ignore=scripts/

  verify:
    name: Verify and smoke-test distributions
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify rendering and install the API extra
        run: |
          python -m pip install --disable-pip-version-check "twine==7.0.0"
          python -m twine check dist/*
          python - <<'PY'
          import pathlib
          import subprocess
          import venv

          root = pathlib.Path("/tmp/swiss-caselaw-release-smoke")
          venv.EnvBuilder(with_pip=True).create(root)
          python = root / "bin" / "python"
          wheel = next(pathlib.Path("dist").glob("*.whl")).resolve()
          subprocess.run([python, "-m", "pip", "install", f"{wheel}[api]"], check=True)
          subprocess.run(
              [python, "-c", "import mcp_server; assert len(mcp_server._list_tools()) == 44"],
              cwd="/tmp",
              check=True,
          )
          PY

  publish:
    name: Publish to PyPI with trusted publishing
    needs: [build, test, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/swiss-caselaw-scrapers
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Recheck immutable artifact hashes
        env:
          EXPECTED_WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          EXPECTED_SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib

          dist = pathlib.Path("dist")
          wheel = next(dist.glob("swiss_caselaw_scrapers-*.whl"))
          sdist = next(dist.glob("swiss_caselaw_scrapers-*.tar.gz"))
          actual = {
              "wheel": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "sdist": hashlib.sha256(sdist.read_bytes()).hexdigest(),
          }
          expected = {
              "wheel": os.environ["EXPECTED_WHEEL_SHA256"],
              "sdist": os.environ["EXPECTED_SDIST_SHA256"],
          }
          if actual != expected:
              raise SystemExit(f"artifact hash mismatch: {actual=} {expected=}")
          PY

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
