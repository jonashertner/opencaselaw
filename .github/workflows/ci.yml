name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio openai anthropic google-genai openapi-spec-validator pillow

      - name: Schema consistency tests
        run: python test_schema.py

      - name: Parsing tests
        run: python test_parsing.py

      - name: Import checks
        run: |
          python -c "from db_schema import SCHEMA_SQL, INSERT_COLUMNS, INSERT_SQL"
          python -c "from export_parquet import DECISION_SCHEMA, normalize_row"
          python -c "from models import Decision, make_decision_id, parse_date"
          python -c "from scrapers import get_registry; r = get_registry(); print(f'{len(r)} scrapers')"
          python -c "from quality_report import generate_quality_report, check_gates"

      - name: Unit tests (offline)
        run: |
          pytest -q \
            --ignore=test_bger_live.py \
            --ignore=test_federal_live.py \
            --ignore=test_build_vectors.py \
            --ignore=test_appeal_chain.py \
            --ignore=scripts/

      - name: Quality-control package tests
        run: pytest tests/qc/ -q

      - name: Quality-control check discovery
        run: python -m quality.cli list

      - name: Wheel build + content verification
        run: |
          # `--no-isolation` reuses the runner's Python env, which is fast
          # but means setuptools + wheel must be present (otherwise:
          # "Backend 'setuptools.build_meta' is not available").
          pip install --quiet build setuptools wheel
          python -m build --wheel --no-isolation
          python - <<'PY'
          import pathlib, sys, tomllib, zipfile
          wheels = list(pathlib.Path('dist').glob('swiss_caselaw_scrapers-*.whl'))
          if len(wheels) != 1:
              print('FAIL: expected exactly one wheel, got', wheels)
              sys.exit(1)
          z = zipfile.ZipFile(wheels[0])
          config = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          configured_modules = config['tool']['setuptools']['py-modules']
          required = (
              'quality/', 'web_api/', 'study/', 'scrapers/', 'search_stack/',
              *(f'{module}.py' for module in configured_modules),
          )
          missing = [r for r in required if not any(n.startswith(r) or n == r for n in z.namelist())]
          if missing:
              print('FAIL: wheel missing', missing)
              sys.exit(1)
          print('OK: wheel ships', len(required), 'required modules')
          PY

  client:
    name: ocl client (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the client and pytest
        run: pip install "./clients/python[pdf]" pytest
      - name: Client tests
        run: pytest clients/python/tests -q -p no:cacheprovider
      - name: Entry point and completion
        run: |
          ocl --version
          ocl --help
          ocl completion bash
          ocl completion zsh
          ocl completion fish

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: web_ui exists?
        id: web
        run: |
          if [ -f web_ui/package.json ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.web.outputs.build == 'true'
        with:
          node-version: '20'
      - name: web_ui build
        if: steps.web.outputs.build == 'true'
        working-directory: web_ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Tectonic
        # Tectonic is a hermetic LaTeX engine; one-binary install, fetches
        # packages on demand. Catches regressions like the underscore-package
        # / hyperref clash that broke the v3 paper compile in 2026-05.
        # The drop-sh installer host resets connections now and then (2026-09-05:
        # "Recv failure: Connection reset by peer" twice in one hour), which turned an
        # unrelated docs/paper job into a merge blocker. Prefer the pinned GitHub
        # release asset; fall back to the installer script only if that download fails.
        run: |
          set -o pipefail
          ASSET="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          if curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 5 "$ASSET" | tar -xz tectonic; then
            echo "tectonic 0.17.0 from GitHub releases"
          else
            echo "release download failed; using the drop-sh installer"
            curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 5 https://drop-sh.fullyjustified.net | sh
          fi
          sudo mv tectonic /usr/local/bin/
          tectonic --version
      - name: Compile docs/paper/v3/paper.tex
        working-directory: docs/paper/v3
        run: tectonic --keep-logs paper.tex
