/* OpenCaseLaw artifacts: one family with citecheck (its palette and faces).
   Layout: a slim masthead band, then a centred work area of one or two columns. */
:root {
  --frame: #ebe9e4;
  --ground: #f6f5f2;
  --paper: #ffffff;
  --ink: #20252a;
  --muted: #59636d;
  --rule: #dddeda;
  --rule-strong: #808892;
  --action: #244d72;
  --action-ink: #ffffff;
  --good: #236746;
  --warn: #8a5400;
  --bad: #b0352b;
  --wash-good: #e6f1ea;
  --wash-warn: #f7efdd;
  --wash-bad: #faece9;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --frame: #171a1d; --ground: #1e2226; --paper: #272c31; --ink: #f0eee8; --muted: #b1b7bd;
    --rule: #3a4147; --rule-strong: #73808d; --action: #9ec2e6; --action-ink: #17222d;
    --good: #85c7a3; --warn: #e4b45f; --bad: #f28d83;
    --wash-good: #22302a; --wash-warn: #332d22; --wash-bad: #382928;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --frame: #171a1d; --ground: #1e2226; --paper: #272c31; --ink: #f0eee8; --muted: #b1b7bd;
  --rule: #3a4147; --rule-strong: #73808d; --action: #9ec2e6; --action-ink: #17222d;
  --good: #85c7a3; --warn: #e4b45f; --bad: #f28d83;
  --wash-good: #22302a; --wash-warn: #332d22; --wash-bad: #382928;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--frame); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
p, h1, h2, h3, ol, ul, dl, dd, figure, blockquote { margin: 0; padding: 0; }
ol, ul { list-style: none; }
a { color: var(--action); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; }

/* ── masthead ── */
.site { border-bottom: 1px solid var(--rule); padding-block: 14px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.site-in { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; }
.brand { font: 600 19px/1.25 var(--serif); letter-spacing: 0.005em; min-width: 0; overflow-wrap: anywhere; }
.brand small { display: inline-block; }
.brand small { font: 500 12px/1 var(--sans); color: var(--muted); margin-left: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
.intro { grid-column: 1 / -1; color: var(--muted); max-width: 72ch; }
.langs { display: flex; }
.lang { border: 0; background: none; padding: 0 6px; min-height: 30px; min-width: 28px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.lang[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }

/* ── work area ── */
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.wrap.single { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--ground); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; min-width: 0; }
.panel + .panel { margin-top: 0; }
.stack { display: grid; gap: 12px; min-width: 0; }
.h { font: 600 15px/1.3 var(--sans); }
.eyebrow { font: 600 11px/1.3 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.serif { font-family: var(--serif); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.spread { justify-content: space-between; }

/* ── controls ── */
label.field { display: grid; gap: 4px; font-weight: 600; }
textarea, input[type="text"], input[type="search"], input[type="number"], select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--paper); color: var(--ink); font-weight: 400; }
textarea { resize: vertical; font: 15px/1.55 var(--serif); }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; }
.check input { margin-top: 3px; }
.primary { border: 0; border-radius: 4px; padding: 9px 16px; min-height: 38px; cursor: pointer; background: var(--action); color: var(--action-ink); font-weight: 600; }
.primary:disabled { opacity: 0.45; cursor: default; }
.quiet { border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 11px; min-height: 32px; background: var(--paper); cursor: pointer; }
.quiet:hover:not(:disabled) { border-color: var(--ink); }
.quiet:disabled { opacity: 0.55; cursor: default; }
.link { border: 0; padding: 0; background: none; color: var(--action); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* ── states ── */
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-good { color: var(--good); box-shadow: inset 0 0 0 1.5px var(--good); }
.pill-warn { color: var(--warn); background: var(--wash-warn); }
.pill-bad { color: var(--bad); background: var(--wash-bad); }
.pill-plain { color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.alert { padding: 8px 10px; border-left: 3px solid var(--bad); background: var(--wash-bad); border-radius: 0 4px 4px 0; }
.note { padding: 8px 10px; border-left: 3px solid var(--rule-strong); background: var(--paper); border-radius: 0 4px 4px 0; color: var(--muted); }
.error-line { color: var(--bad); }
.code { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.busy { color: var(--muted); }
.busy::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-left: 8px; border: 2px solid var(--rule-strong); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .busy::after { animation: none; } }
.empty { padding: 8px 0; }
.empty p { margin-top: 6px; color: var(--muted); max-width: 60ch; }
.excerpt { margin-top: 4px; padding: 4px 10px; border-left: 2px solid var(--rule-strong); font: 14px/1.55 var(--serif); overflow-wrap: anywhere; }
.cite { font-family: var(--serif); overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; }

/* ── foot ── */
.foot { max-width: 1120px; margin: 0 auto; padding-block: 0 24px; color: var(--muted); font-size: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── Markdown from the tools ── */
.md { display: grid; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.md-h { font: 600 14px/1.35 var(--sans); margin-top: 6px; }
h3.md-h { font-size: 15px; }
.md-p { max-width: 75ch; }
.md-list { display: grid; gap: 6px; padding-left: 0; }
.md-list > li { padding-left: 12px; border-left: 2px solid var(--rule); }
ol.md-list { list-style: none; }
.md-quote { padding: 4px 10px; border-left: 2px solid var(--rule-strong); font-family: var(--serif); }
.md-hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100%; }
.md code { font: 12px/1.4 var(--mono); }

.block { display: block; font-weight: 400; margin-top: 1px; }

/* ── one-click examples on a first view ── */
.examples { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.chip-btn { border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--paper); padding: 3px 11px; min-height: 28px; cursor: pointer; font-size: 13px; }
.chip-btn:hover { border-color: var(--action); color: var(--action); }
.empty .examples { margin-top: 10px; }

/* ── the frame: setup card in claude.ai, site bar on opencaselaw.ch ── */
.ocl-setup { grid-column: 1 / -1; display: grid; gap: 8px; border-left: 3px solid var(--action); }
.ocl-setup-title { font: 600 15px/1.3 var(--sans); }
.ocl-setup p { max-width: 75ch; }
.ocl-steps { list-style: decimal; padding-left: 22px; display: grid; gap: 4px; max-width: 75ch; }
.ocl-setup-links { margin-top: 4px; }
.button-link { display: inline-block; border-radius: 4px; padding: 7px 14px; background: var(--action); color: var(--action-ink); font-weight: 600; text-decoration: none; }
.button-link:hover { filter: brightness(1.08); }
.ocl-bar { background: var(--paper); border-bottom: 1px solid var(--rule); font-size: 13px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ocl-bar-in { max-width: 1120px; margin: 0 auto; min-height: 40px; display: flex; align-items: center; gap: 8px; }
.ocl-bar a { color: var(--ink); text-decoration: none; }
.ocl-bar a:hover { color: var(--action); text-decoration: underline; }
.ocl-home { font: 600 15px/1 var(--serif); }
.ocl-sep { color: var(--muted); margin: 0 4px; }
.ocl-links { margin-top: 8px; }

[hidden] { display: none !important; }

/* The list of tools: one card each, two or three to a row. */
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.tool { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; text-decoration: none; color: inherit; }
.tool:hover { border-color: var(--action); }
.tool:hover .tool-title { color: var(--action); }
.tool-title { font: 600 18px/1.3 var(--serif); }
.tool-body { color: var(--muted); }
.tool-go { font-weight: 600; color: var(--action); font-size: 13px; }
.claude { display: grid; gap: 8px; margin-top: 6px; }
.claude ul { display: grid; gap: 4px; }

</style>
</head>

const $ = (id) => document.getElementById(id);
const pages = (typeof OCL_PAGES === 'object' && OCL_PAGES) || {};
const PUBLIC_ARTIFACTS = typeof OCL_ARTIFACTS_PUBLIC !== 'undefined' && OCL_ARTIFACTS_PUBLIC === true;

function render() {
  document.title = t('brand') + ' · OpenCaseLaw';
  $('brand').textContent = t('brand');
  $('intro').textContent = t('intro');
  OCL.langButtons($('langs'));
  $('foot').textContent = t('foot');
  const q = OCL.language() === 'de' ? '' : '?lang=' + OCL.language();
  $('tools').replaceChildren(...ORDER.filter((k) => pages[k] && pages[k].web).map((k) => {
    const [title, body] = t(k).split('|');
    const a = el('a', 'tool');
    a.href = pages[k].web + q;
    a.append(el('h2', 'tool-title', title), el('p', 'tool-body', body), el('span', 'tool-go', t('open')));
    return a;
  }));
  const box = $('claude');
  box.hidden = !PUBLIC_ARTIFACTS;
  if (PUBLIC_ARTIFACTS) {
    const list = el('ul');
    for (const k of [...ORDER, 'trainer']) {
      if (!pages[k] || !pages[k].artifact) continue;
      const li = el('li');
      li.append(OCL.link(pages[k].artifact, pages[k].title));
      list.append(li);
    }
    box.replaceChildren(el('h2', 'h', t('claude_title')), el('p', 'muted', t('claude_body')), list);
  }
}

OCL.onLang(render);
OCL.initLang();
