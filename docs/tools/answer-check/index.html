<style>
/* OpenCaseLaw artifacts: one family with citecheck (its palette and faces).
   Layout: a slim masthead band, then a centred work area of one or two columns. */
:root {
  --frame: #ebe9e4;
  --ground: #f6f5f2;
  --paper: #ffffff;
  --ink: #20252a;
  --muted: #59636d;
  --rule: #dddeda;
  --rule-strong: #808892;
  --action: #244d72;
  --action-ink: #ffffff;
  --good: #236746;
  --warn: #8a5400;
  --bad: #b0352b;
  --wash-good: #e6f1ea;
  --wash-warn: #f7efdd;
  --wash-bad: #faece9;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --frame: #171a1d; --ground: #1e2226; --paper: #272c31; --ink: #f0eee8; --muted: #b1b7bd;
    --rule: #3a4147; --rule-strong: #73808d; --action: #9ec2e6; --action-ink: #17222d;
    --good: #85c7a3; --warn: #e4b45f; --bad: #f28d83;
    --wash-good: #22302a; --wash-warn: #332d22; --wash-bad: #382928;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --frame: #171a1d; --ground: #1e2226; --paper: #272c31; --ink: #f0eee8; --muted: #b1b7bd;
  --rule: #3a4147; --rule-strong: #73808d; --action: #9ec2e6; --action-ink: #17222d;
  --good: #85c7a3; --warn: #e4b45f; --bad: #f28d83;
  --wash-good: #22302a; --wash-warn: #332d22; --wash-bad: #382928;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--frame); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
p, h1, h2, h3, ol, ul, dl, dd, figure, blockquote { margin: 0; padding: 0; }
ol, ul { list-style: none; }
a { color: var(--action); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; }

/* ── masthead ── */
.site { border-bottom: 1px solid var(--rule); padding-block: 14px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.site-in { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; }
.brand { font: 600 19px/1.25 var(--serif); letter-spacing: 0.005em; min-width: 0; overflow-wrap: anywhere; }
.brand small { display: inline-block; }
.brand small { font: 500 12px/1 var(--sans); color: var(--muted); margin-left: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
.intro { grid-column: 1 / -1; color: var(--muted); max-width: 72ch; }
.langs { display: flex; }
.lang { border: 0; background: none; padding: 0 6px; min-height: 30px; min-width: 28px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.lang[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }

/* ── work area ── */
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.wrap.single { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--ground); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; min-width: 0; }
.panel + .panel { margin-top: 0; }
.stack { display: grid; gap: 12px; min-width: 0; }
.h { font: 600 15px/1.3 var(--sans); }
.eyebrow { font: 600 11px/1.3 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.serif { font-family: var(--serif); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.spread { justify-content: space-between; }

/* ── controls ── */
label.field { display: grid; gap: 4px; font-weight: 600; }
textarea, input[type="text"], input[type="search"], input[type="number"], select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--paper); color: var(--ink); font-weight: 400; }
textarea { resize: vertical; font: 15px/1.55 var(--serif); }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; }
.check input { margin-top: 3px; }
.primary { border: 0; border-radius: 4px; padding: 9px 16px; min-height: 38px; cursor: pointer; background: var(--action); color: var(--action-ink); font-weight: 600; }
.primary:disabled { opacity: 0.45; cursor: default; }
.quiet { border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 11px; min-height: 32px; background: var(--paper); cursor: pointer; }
.quiet:hover:not(:disabled) { border-color: var(--ink); }
.quiet:disabled { opacity: 0.55; cursor: default; }
.link { border: 0; padding: 0; background: none; color: var(--action); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* ── states ── */
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-good { color: var(--good); box-shadow: inset 0 0 0 1.5px var(--good); }
.pill-warn { color: var(--warn); background: var(--wash-warn); }
.pill-bad { color: var(--bad); background: var(--wash-bad); }
.pill-plain { color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.alert { padding: 8px 10px; border-left: 3px solid var(--bad); background: var(--wash-bad); border-radius: 0 4px 4px 0; }
.note { padding: 8px 10px; border-left: 3px solid var(--rule-strong); background: var(--paper); border-radius: 0 4px 4px 0; color: var(--muted); }
.error-line { color: var(--bad); }
.code { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.busy { color: var(--muted); }
.busy::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-left: 8px; border: 2px solid var(--rule-strong); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .busy::after { animation: none; } }
.empty { padding: 8px 0; }
.empty p { margin-top: 6px; color: var(--muted); max-width: 60ch; }
.excerpt { margin-top: 4px; padding: 4px 10px; border-left: 2px solid var(--rule-strong); font: 14px/1.55 var(--serif); overflow-wrap: anywhere; }
.cite { font-family: var(--serif); overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; }

/* ── foot ── */
.foot { max-width: 1120px; margin: 0 auto; padding-block: 0 24px; color: var(--muted); font-size: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── Markdown from the tools ── */
.md { display: grid; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.md-h { font: 600 14px/1.35 var(--sans); margin-top: 6px; }
h3.md-h { font-size: 15px; }
.md-p { max-width: 75ch; }
.md-list { display: grid; gap: 6px; padding-left: 0; }
.md-list > li { padding-left: 12px; border-left: 2px solid var(--rule); }
ol.md-list { list-style: none; }
.md-quote { padding: 4px 10px; border-left: 2px solid var(--rule-strong); font-family: var(--serif); }
.md-hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100%; }
.md code { font: 12px/1.4 var(--mono); }

.block { display: block; font-weight: 400; margin-top: 1px; }

/* ── one-click examples on a first view ── */
.examples { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.chip-btn { border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--paper); padding: 3px 11px; min-height: 28px; cursor: pointer; font-size: 13px; }
.chip-btn:hover { border-color: var(--action); color: var(--action); }
.empty .examples { margin-top: 10px; }

/* ── the frame: setup card in claude.ai, site bar on opencaselaw.ch ── */
.ocl-setup { grid-column: 1 / -1; display: grid; gap: 8px; border-left: 3px solid var(--action); }
.ocl-setup-title { font: 600 15px/1.3 var(--sans); }
.ocl-setup p { max-width: 75ch; }
.ocl-steps { list-style: decimal; padding-left: 22px; display: grid; gap: 4px; max-width: 75ch; }
.ocl-setup-links { margin-top: 4px; }
.button-link { display: inline-block; border-radius: 4px; padding: 7px 14px; background: var(--action); color: var(--action-ink); font-weight: 600; text-decoration: none; }
.button-link:hover { filter: brightness(1.08); }
.ocl-bar { background: var(--paper); border-bottom: 1px solid var(--rule); font-size: 13px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ocl-bar-in { max-width: 1120px; margin: 0 auto; min-height: 40px; display: flex; align-items: center; gap: 8px; }
.ocl-bar a { color: var(--ink); text-decoration: none; }
.ocl-bar a:hover { color: var(--action); text-decoration: underline; }
.ocl-home { font: 600 15px/1 var(--serif); }
.ocl-sep { color: var(--muted); margin: 0 4px; }
.ocl-links { margin-top: 8px; }

[hidden] { display: none !important; }

/* Antwortprüfung: the text on the left, the audit on the right; in the audit the text
   again, every reference marked where it stands, and the findings below it. */
.block { display: block; font-weight: 400; margin-top: 1px; }
.example-note { color: var(--warn); }
.opts { gap: 8px; }
.copy-fallback { width: 100%; height: 6em; font: 12px/1.4 var(--mono); }

.verdict { font: 600 17px/1.35 var(--sans); }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
.verdict.plain { color: var(--ink); }
.stale { color: var(--warn); }

/* the tally: one cell per check, the count that passed over the count examined */
.ledger { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.cell { background: var(--paper); padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.cell .label { font-size: 12px; color: var(--muted); }
.cell .value { font: 600 18px/1.2 var(--sans); font-variant-numeric: tabular-nums; }
.cell .sub { font-size: 11px; color: var(--muted); }
.cell.good .value { color: var(--good); }
.cell.bad { box-shadow: inset 0 3px 0 var(--bad); }
.cell.bad .value { color: var(--bad); }
.cell.none .value { color: var(--muted); font-weight: 500; font-size: 14px; }

@media (max-width: 520px) { .ledger { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* the text with its marks */
.reading { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; font: 15px/1.7 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 60vh; overflow-y: auto; }
.m { background: none; color: inherit; border-radius: 2px; }
.m-bad { box-shadow: inset 0 -0.5em 0 var(--wash-bad); text-decoration: underline wavy var(--bad); text-decoration-thickness: 1px; text-underline-offset: 3px; cursor: pointer; }
.m-claim { text-decoration: underline dotted var(--warn); text-decoration-thickness: 2px; text-underline-offset: 4px; cursor: pointer; }
.m-good { box-shadow: inset 0 -0.45em 0 var(--wash-good); }
.m-focus { outline: 2px solid var(--action); outline-offset: 1px; }
.chip { display: inline-block; margin-left: 3px; padding: 0 5px; border-radius: 999px; font: 600 11px/1.5 var(--sans); vertical-align: 1px; white-space: nowrap; }
.chip-ok { color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
.chip-maybe { color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
.chip-bad { color: var(--bad); background: var(--wash-bad); cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { width: 18px; height: 9px; border-radius: 2px; display: inline-block; }
.swatch.bad { background: var(--wash-bad); border-bottom: 2px solid var(--bad); }
.swatch.claim { border-bottom: 2px dotted var(--warn); }
.swatch.good { background: var(--wash-good); }

/* findings */
.issues { display: grid; gap: 8px; }
.issue { background: var(--paper); border: 1px solid var(--rule); border-left: 3px solid var(--bad); border-radius: 0 6px 6px 0; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; scroll-margin: 12px; }
.issue.cat-grounding { border-left-color: var(--warn); }
.issue.focus { outline: 2px solid var(--action); outline-offset: 1px; }
.issue-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.issue-title { font-weight: 600; }
.issue .cite { font-size: 15px; }
.issue .jump { justify-self: start; font-size: 12px; }
.goodlist li { padding: 4px 0; border-top: 1px solid var(--rule); }
.goodlist li:first-child { border-top: 0; }
.scope li { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 2px 12px; padding: 6px 0; border-top: 1px solid var(--rule); }
.scope li:first-child { border-top: 0; }
.scope .what { font-family: var(--serif); }

</style>
</head>

</main>
<footer class="foot"><p id="foot"></p></footer>

  // One tool call; resolves the JSON payload, rejects with the platform's error object.

  async function call(tool, input, { staleTime = 600000, text = false } = {}) {

// ── where things stand in the text ────────────────────────────────────────
// The server counts positions in code points, the page in UTF-16 units; the two agree
// unless the text holds characters outside the BMP. So a position is trusted only where
// the cited text really stands there, else the nearest occurrence is used.
function locate(text, needle, near) {
  if (!needle) return null;
  if (near >= 0 && text.substr(near, needle.length) === needle) return [near, near + needle.length];
  let best = null;
  for (let at = text.indexOf(needle); at >= 0; at = text.indexOf(needle, at + 1)) {
    if (best === null || Math.abs(at - near) < Math.abs(best - near)) best = at;
  }
  return best === null ? null : [best, best + needle.length];
}

// The server's annotated text is the draft with " ✓", " ✓?" or " ⚠️[CODE]" inserted
// after each case citation; walking both side by side gives where each mark belongs.
function markersOf(text, annotated) {
  const out = [];
  if (!annotated) return out;
  let i = 0;
  let j = 0;
  while (j < annotated.length) {
    // A mark is looked for first: its leading space would otherwise pass as the text's own.
    const m = annotated[j] === ' ' && /^ (✓\?|✓|⚠️\[[A-Z_]+\])/u.exec(annotated.slice(j, j + 40));
    if (m && text.slice(i, i + m[0].length) !== m[0]) {
      out.push({ at: i, kind: m[1] === '✓' ? 'ok' : m[1] === '✓?' ? 'maybe' : 'bad' });
      j += m[0].length;
      continue;
    }
    if (i < text.length && text[i] === annotated[j]) { i++; j++; continue; }
    return [];                               // out of step: no marks rather than wrong ones
  }
  return i === text.length ? out : [];
}

// A quote the server found: from its start to the closing quotation mark.
function quoteSpan(text, match) {
  const head = String(match.quote || '').replace(/…$/, '');
  const at = locate(text, head.slice(0, 40), match.position);
  if (!at) return null;
  let start = at[0];
  if (start > 0 && /[«"„“‹]/.test(text[start - 1])) start--;
  const close = /[«]/.test(text[start]) ? '»' : /[„“]/.test(text[start]) ? '“”' : /[‹]/.test(text[start]) ? '›' : '"';
  let end = start + 1;
  while (end < text.length && !close.includes(text[end]) && end - start < 600) end++;
  return [start, Math.min(end + 1, text.length)];
}

function spansOf(text, payload) {
  const spans = [];
  (payload.issues || []).forEach((issue, n) => {
    const at = locate(text, issue.citation, issue.position);
    if (at) spans.push({ s: at[0], e: at[1], kind: issue.category === 'grounding' ? 'claim-cite' : 'bad', issue: n });
    if (issue.category === 'grounding' && issue.claim) {
      const c = locate(text, issue.claim, Math.max(0, (issue.position || 0) - issue.claim.length - 4));
      if (c) spans.push({ s: c[0], e: c[1], kind: 'claim', issue: n });
    }
  });
  const matches = (((payload.ledger || {}).quotations || {}).matches) || [];
  for (const m of matches) {
    const q = quoteSpan(text, m);
    if (q) spans.push({ s: q[0], e: q[1], kind: 'good', issue: null });
  }
  return spans;
}

// ── rendering ─────────────────────────────────────────────────────────────
function issueTitle(issue) {
  if (issue.category === 'grounding') return t('p_grounding_' + (['no', 'contradicts', 'partial', 'unrelated'].includes(issue.supports) ? issue.supports : 'no'));
  const known = ['pinpoint_not_in_decision', 'decision_not_in_corpus', 'date_does_not_match_decision', 'quote_not_in_cited_sources', 'article_not_in_law', 'law_abbreviation_unknown'];
  return known.includes(issue.problem) ? t('p_' + issue.problem, { law: issue.law_code || '' }) : t('p_unknown', { problem: issue.problem || issue.category });
}

function issueDetails(issue) {
  const out = [];
  switch (issue.problem) {
    case 'pinpoint_not_in_decision':
      if (Array.isArray(issue.valid_pinpoints) && issue.valid_pinpoints.length) out.push(el('p', null, t('d_valid_pinpoints', { list: issue.valid_pinpoints.map((p) => 'E. ' + p).join(', ') })));
      break;
    case 'decision_not_in_corpus': out.push(el('p', 'muted', t('d_not_in_corpus'))); break;
    case 'date_does_not_match_decision': out.push(el('p', null, t('d_date', { claimed: OCL.date(issue.claimed_date), actual: OCL.date(issue.actual_date) }))); break;
    case 'quote_not_in_cited_sources': {
      const sources = [...new Set((issue.searched_sources || []).map((s) => s.replace(/^statute:(\w+)_(\w+)$/, 'Art. $2 $1').replace(/^bge_/, 'BGE ').replace(/^bger_(\w+)_(\w+)_(\d{4})$/, '$1_$2/$3')))];
      if (sources.length) out.push(el('p', 'muted small', t('d_quote', { list: sources.join(', ') })));
      break;
    }
    case 'article_not_in_law': out.push(el('p', 'muted small', t('d_article', { article: issue.article || '', law: issue.law_code || '', sr: issue.sr_number ? ' (SR ' + issue.sr_number + ')' : '' }))); break;
    case 'law_abbreviation_unknown': out.push(el('p', 'muted', t('d_law'))); break;
    default:
      if (issue.category !== 'grounding' && issue.suggestion) {
        out.push(el('p', 'eyebrow', t('d_server_hint')), el('p', 'small', issue.suggestion));
      }
  }
  if (issue.category === 'grounding') {
    if (issue.claim) out.push(el('p', 'eyebrow', t('d_claim')), el('blockquote', 'excerpt', issue.claim));
    out.push(el('p', 'muted small', t('d_grounding', { source: issue.checked_text_source || '–', pct: typeof issue.confidence === 'number' ? OCL.num(Math.round(issue.confidence * 100)) : '–' })));
    if (issue.reasoning) out.push(el('p', 'eyebrow', t('model_reasons')), el('p', 'small', issue.reasoning));
  }
  return out;
}

function focusIssue(n, from) {
  state.focus = n;
  for (const node of document.querySelectorAll('.m-focus, .issue.focus')) node.classList.remove('m-focus', 'focus');
  const card = document.getElementById('issue-' + n);
  const marks = document.querySelectorAll(`[data-issue="${n}"]`);
  if (card) card.classList.add('focus');
  marks.forEach((m) => m.classList.add('m-focus'));
  const target = from === 'text' ? card : marks[0];
  if (target) target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function renderReading(text, payload) {
  const box = el('div', 'reading');
  box.tabIndex = 0;
  const spans = spansOf(text, payload);
  const markers = markersOf(text, payload.annotated_text).filter((m) => m.kind !== 'bad');
  const cuts = new Set([0, text.length]);
  for (const s of spans) { cuts.add(s.s); cuts.add(s.e); }
  for (const m of markers) cuts.add(m.at);
  const points = [...cuts].sort((a, b) => a - b);
  const chipsAt = new Map();
  for (const m of markers) chipsAt.set(m.at, [...(chipsAt.get(m.at) || []), m.kind]);
  for (let k = 0; k < points.length; k++) {
    const at = points[k];
    for (const kind of chipsAt.get(at) || []) {
      const chip = el('span', 'chip chip-' + kind, t(kind === 'ok' ? 'chip_ok' : 'chip_maybe'));
      chip.title = t(kind === 'ok' ? 'chip_ok_title' : 'chip_maybe_title');
      box.append(chip);
    }
    if (k === points.length - 1) break;
    const s = at;
    const e = points[k + 1];
    const piece = text.slice(s, e);
    const over = spans.filter((x) => x.s <= s && x.e >= e);
    if (!over.length) { box.append(piece); continue; }
    const kinds = new Set(over.map((x) => x.kind));
    const issue = (over.find((x) => x.kind === 'bad') || over.find((x) => x.issue !== null) || {}).issue;
    const mark = el('mark', 'm ' + [kinds.has('bad') ? 'm-bad' : '', kinds.has('claim') || kinds.has('claim-cite') ? 'm-claim' : '', kinds.has('good') ? 'm-good' : ''].join(' ').trim(), piece);
    if (issue !== undefined && issue !== null) {
      mark.dataset.issue = String(issue);
      mark.tabIndex = 0;
      mark.setAttribute('role', 'button');
      const go = () => focusIssue(issue, 'text');
      mark.addEventListener('click', go);
      mark.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
    }
    box.append(mark);
  }
  return box;
}

function ledgerCell(label, ok, n, extra) {
  const cell = el('div', 'cell');
  cell.append(el('span', 'label', label));
  if (n === null) { cell.classList.add('none'); cell.append(el('span', 'value', extra || t('led_off'))); return cell; }
  if (n === 0) { cell.classList.add('none'); cell.append(el('span', 'value', t('led_none'))); return cell; }
  cell.classList.add(ok === n ? 'good' : 'bad');
  cell.append(el('span', 'value', t('led_of', { ok: OCL.num(ok), n: OCL.num(n) })), el('span', 'sub', extra || t('led_sub_ok')));
  return cell;
}

function renderLedger(payload) {
  const L = payload.ledger || {};
  const by = payload.issues_by_category || {};
  const issues = payload.issues || [];
  const c = L.citations || {}; const p = L.pinpoints || {}; const s = L.statutes || {}; const q = L.quotations || {}; const d = L.dates || {};
  const g = payload.grounding_meta || {};
  const grid = el('div', 'ledger');
  const resolvedOk = Math.max(0, (c.resolved || 0));
  grid.append(ledgerCell(t('led_cases'), resolvedOk, c.found || 0));
  const pinsBad = issues.filter((i) => i.problem === 'pinpoint_not_in_decision').length;
  grid.append(ledgerCell(t('led_pins'), Math.max(0, (p.found || 0) - pinsBad), p.found || 0, p.unverified ? t('led_skipped', { n: OCL.num(p.unverified) }) : null));
  grid.append(ledgerCell(t('led_statutes'), s.verified || 0, s.checked === false ? null : (s.found_unique || 0)));
  grid.append(ledgerCell(t('led_quotes'), q.verbatim || 0, q.audited === false ? null : (q.examined || 0), (q.skipped_short || 0) + (q.skipped_unanchored || 0) ? t('led_skipped', { n: OCL.num((q.skipped_short || 0) + (q.skipped_unanchored || 0)) }) : null));
  grid.append(ledgerCell(t('led_dates'), (d.found || 0) - (d.issues || 0), d.found || 0));
  grid.append(ledgerCell(t('led_grounding'), Math.max(0, (g.checked || 0) - (by.grounding || 0)), g.requested && g.available !== false ? (g.checked || 0) : null));
  return grid;
}

function renderScope(items) {
  const list = el('ul', 'scope');
  for (const item of items) {
    const li = el('li');
    li.append(el('span', 'what', item));
    const look = state.lookups.get(item);
    const said = el('span', 'small');
    if (!/\d/.test(item)) said.append(el('span', 'muted', t('look_name')));
    else if (!look || look.busy) said.append(el('span', 'busy', t('look_busy')));
    else if (look.error) said.append(el('span', 'error-line', OCL.errorText(look.error)));
    else if (look.result.exists) said.append(t('look_found') + ' ', OCL.link(look.result.canonical_url, OCL.citationOf(look.result), 'cite'));
    else if ((look.result.close_matches || []).length) {
      said.append(t('look_close') + ' ');
      look.result.close_matches.slice(0, 3).forEach((m, k) => {
        if (k) said.append('; ');
        said.append(OCL.link(m.canonical_url, OCL.citationOf(m) || m.decision_id, 'cite'));
      });
    } else said.append(el('span', 'muted', t('look_none')));
    li.append(said);
    list.append(li);
  }
  return list;
}

async function lookUp(items) {
  for (const item of items.filter((x) => /\d/.test(x)).slice(0, 8)) {
    if (state.lookups.has(item)) continue;
    const entry = { busy: true };
    state.lookups.set(item, entry);
    render();
    try { entry.result = await OCL.call('cite', { reference: item, language: OCL.toolLang() }); } catch (error) { entry.error = await OCL.failure(error); }
    entry.busy = false;
    render();
  }
}

function render() {
  const out = $('out');
  const draft = $('draft').value;
  if (state.busy) {
    out.replaceChildren(el('p', 'busy', t(state.grounding ? 'busy_grounding' : 'busy')));
    return;
  }
  if (state.error) {
    out.replaceChildren(OCL.renderError(state.error, runCheck, render));
    return;
  }
  const payload = state.result;
  if (!payload) {
    const box = el('div', 'empty stack');
    box.append(el('h2', 'h', t('empty_title')), el('p', null, t('empty_body')));
    const list = el('ul', 'goodlist small');
    for (const k of ['check_case', 'check_statute', 'check_quote', 'check_date', 'check_grounding']) list.append(el('li', null, t(k)));
    box.append(el('p', 'eyebrow', t('checks_title')), list);
    out.replaceChildren(box);
    return;
  }
  const text = state.checked;
  const issues = payload.issues || [];
  const nothing = !((payload.ledger || {}).citations || {}).found && !((payload.ledger || {}).statutes || {}).found_unique && !((payload.ledger || {}).quotations || {}).examined && !((payload.ledger || {}).dates || {}).found;
  const parts = [];
  const verdict = el('p', 'verdict ' + (nothing ? 'plain' : issues.length ? 'bad' : 'good'),
    nothing ? t('verdict_nothing') : issues.length === 0 ? t('verdict_ok') : issues.length === 1 ? t('verdict_one') : t('verdict_n', { n: OCL.num(issues.length) }));
  parts.push(verdict);
  if (draft !== text) parts.push(el('p', 'stale small', t('stale')));
  parts.push(renderLedger(payload));

  parts.push(el('h2', 'h', t('h_text')));
  const legend = el('div', 'legend');
  const sw = (cls, label) => { const s = el('span'); s.append(el('i', 'swatch ' + cls), label); return s; };
  const okChip = el('span'); okChip.append(el('span', 'chip chip-ok', t('chip_ok')), t('lg_ok'));
  legend.append(sw('bad', t('lg_bad')), sw('claim', t('lg_claim')), sw('good', t('lg_good')), okChip);
  parts.push(legend, renderReading(text, payload));

  if (issues.length) {
    parts.push(el('h2', 'h', t('h_issues')));
    const list = el('div', 'issues');
    issues.map((issue, n) => ({ issue, n })).sort((a, b) => (a.issue.position || 0) - (b.issue.position || 0)).forEach(({ issue, n }) => {
      const card = el('article', 'issue cat-' + issue.category);
      card.id = 'issue-' + n;
      const head = el('div', 'issue-head');
      head.append(el('span', 'pill ' + (issue.category === 'grounding' ? 'pill-warn' : 'pill-bad'), t('cat_' + issue.category)), el('span', 'issue-title', issueTitle(issue)));
      card.append(head, el('p', 'cite', issue.category === 'grounding' ? issue.citation : issue.citation));
      card.append(...issueDetails(issue));
      if (document.querySelector) card.append(button('link jump', t('jump'), () => focusIssue(n, 'card')));
      if (state.focus === n) card.classList.add('focus');
      list.append(card);
    });
    parts.push(list);
  }

  const matches = (((payload.ledger || {}).quotations || {}).matches) || [];
  if (matches.length) {
    parts.push(el('h2', 'h', t('h_good')));
    const list = el('ul', 'goodlist');
    for (const m of matches) {
      const li = el('li');
      li.append(el('span', 'serif', '«' + String(m.quote || '').replace(/…$/, '') + '…» '), el('span', 'muted small', t('good_in', { source: String(m.matched_source || '').replace(/^bge_/, 'BGE ') })));
      list.append(li);
    }
    parts.push(list);
  }

  const scope = ((payload.ledger || {}).citations || {}).out_of_scope || [];
  if (scope.length) {
    parts.push(el('h2', 'h', t('h_scope')), el('p', 'small muted', t('scope_intro')), renderScope(scope));
  }

  if (payload.linked_text && payload.linked_text !== text) {
    parts.push(el('h2', 'h', t('h_copy')));
    const row = el('div', 'row');
    const said = el('span', 'small muted', t('copy_intro'));
    const b = button('quiet', t('copy_btn'), async () => {
      const ok = await OCL.copy(payload.linked_text, $('copy-fallback'));
      said.textContent = ok ? t('copied') : t('copy_failed');
    });
    row.append(b, said);
    parts.push(row);
  }
  parts.push(el('p', 'note small', t('certify')));
  out.replaceChildren(...parts);
  if (state.focus !== null) for (const m of out.querySelectorAll(`[data-issue="${state.focus}"]`)) m.classList.add('m-focus');
}

function renderChrome() {
  document.title = 'Antwortprüfung';
  $('brand').textContent = t('brand');
  $('intro').textContent = t('intro');
  OCL.langButtons($('langs'));
  $('draft-label').textContent = t('draft_label');
  $('example').textContent = t('example');
  $('clear').textContent = t('clear');
  $('example-note').textContent = t('example_note');
  $('example-note').hidden = $('draft').value !== EXAMPLE;
  $('opt-grounding-l').textContent = t('opt_grounding');
  $('opt-grounding-h').textContent = t('opt_grounding_h');
  $('opt-quotes-l').textContent = t('opt_quotes');
  $('opt-quotes-h').textContent = t('opt_quotes_h');
  $('sent').textContent = t('sent');
  $('go').textContent = state.busy ? t('busy') : t('go');
  $('go').disabled = state.busy;
  $('foot').textContent = t('foot');
  updateCount();
}

function updateCount() {
  const n = $('draft').value.length;
  $('count').textContent = n > MAX ? t('count_over', { n: OCL.num(n), max: OCL.num(MAX) }) : t('count', { n: OCL.num(n), max: OCL.num(MAX) });
  $('count').classList.toggle('error-line', n > MAX);
  $('example-note').hidden = $('draft').value !== EXAMPLE;
}

async function runCheck() {
  const text = $('draft').value;
  if (!text.trim()) { state.error = null; state.result = null; render(); $('draft').focus(); return; }
  if (text.length > MAX) { updateCount(); $('draft').focus(); return; }
  if (state.busy) return;
  state.busy = true;
  state.error = null;
  state.focus = null;
  state.grounding = $('opt-grounding').checked;
  renderChrome();
  render();
  try {
    const payload = await OCL.call('attest_response', { draft_text: text, audit_grounding: state.grounding, audit_quotes: $('opt-quotes').checked });
    if (!payload.ledger && !Array.isArray(payload.issues)) throw { code: 'tool_error', message: 'unexpected answer' };
    state.result = payload;
    state.checked = text;
    state.lookups = new Map();
  } catch (error) {
    state.error = await OCL.failure(error);
  }
  state.busy = false;
  renderChrome();
  render();
  if (state.result) {
    $('out').focus({ preventScroll: true });
    lookUp((((state.result.ledger || {}).citations || {}).out_of_scope) || []);
  }
}

function start() {
  $('out').tabIndex = -1;
  $('draft').value = EXAMPLE;
  $('form').addEventListener('submit', (ev) => { ev.preventDefault(); runCheck(); });
  $('draft').addEventListener('input', () => { updateCount(); if (state.result) render(); });
  $('example').addEventListener('click', () => { $('draft').value = EXAMPLE; updateCount(); $('draft').focus(); });
  $('clear').addEventListener('click', () => { $('draft').value = ''; updateCount(); $('draft').focus(); });
  OCL.onLang(() => { renderChrome(); render(); });
  OCL.initLang();
}

start();

</script>
