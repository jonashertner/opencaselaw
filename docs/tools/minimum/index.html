:root {

  --paper: #ffffff;
  --ink: #20252a;
  --muted: #59636d;
  --rule: #dddeda;
  --rule-strong: #808892;
  --action: #244d72;
  --action-ink: #ffffff;
  --good: #236746;
  --warn: #8a5400;
  --bad: #b0352b;
  --wash-good: #e6f1ea;
  --wash-warn: #f7efdd;
  --wash-bad: #faece9;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

}

}

* { box-sizing: border-box; }
body { margin: 0; background: var(--frame); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
p, h1, h2, h3, ol, ul, dl, dd, figure, blockquote { margin: 0; padding: 0; }

h1, h2, h3 { text-wrap: balance; }

.site { border-bottom: 1px solid var(--rule); padding-block: 14px 12px;

.site-in { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; }
.brand { font: 600 19px/1.25 var(--serif); letter-spacing: 0.005em; min-width: 0; overflow-wrap: anywhere; }
.brand small { display: inline-block; }
.brand small { font: 500 12px/1 var(--sans); color: var(--muted); margin-left: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
.intro { grid-column: 1 / -1; color: var(--muted); max-width: 72ch; }
.langs { display: flex; }
.lang { border: 0; background: none; padding: 0 6px; min-height: 30px; min-width: 28px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.lang[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }

/* ── work area ── */
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

.wrap.single { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--ground); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; min-width: 0; }
.panel + .panel { margin-top: 0; }
.stack { display: grid; gap: 12px; min-width: 0; }
.h { font: 600 15px/1.3 var(--sans); }
.eyebrow { font: 600 11px/1.3 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.serif { font-family: var(--serif); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.spread { justify-content: space-between; }

label.field { display: grid; gap: 4px; font-weight: 600; }
textarea, input[type="text"], input[type="search"], input[type="number"], select {

.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; }

.primary:disabled { opacity: 0.45; cursor: default; }
.quiet { border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 11px; min-height: 32px; background: var(--paper); cursor: pointer; }
.quiet:hover:not(:disabled) { border-color: var(--ink); }
.quiet:disabled { opacity: 0.55; cursor: default; }
.link { border: 0; padding: 0; background: none; color: var(--action); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* ── states ── */

.pill-good { color: var(--good); box-shadow: inset 0 0 0 1.5px var(--good); }
.pill-warn { color: var(--warn); background: var(--wash-warn); }
.pill-bad { color: var(--bad); background: var(--wash-bad); }

.note { padding: 8px 10px; border-left: 3px solid var(--rule-strong); background: var(--paper); border-radius: 0 4px 4px 0; color: var(--muted); }

.code { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.busy { color: var(--muted); }

.empty { padding: 8px 0; }
.empty p { margin-top: 6px; color: var(--muted); max-width: 60ch; }
.excerpt { margin-top: 4px; padding: 4px 10px; border-left: 2px solid var(--rule-strong); font: 14px/1.55 var(--serif); overflow-wrap: anywhere; }
.cite { font-family: var(--serif); overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; }

/* ── foot ── */

.ocl-sep { color: var(--muted); margin: 0 4px; }
.ocl-links { margin-top: 8px; }

[hidden] { display: none !important; }

/* Existenzminimum-Rechner: the inputs on the left in the order of the guidelines (basic

.fs { border: 0; padding: 0; margin: 0; min-width: 0; }
.fs legend { padding: 0; margin-bottom: 4px; }
.two > * { flex: 1 1 9em; }
.money { position: relative; }
.money input { padding-left: 3.1em; font-variant-numeric: tabular-nums; }
.money::before { content: "CHF"; position: absolute; left: 10px; bottom: 9px; font-size: 12px; color: var(--muted); pointer-events: none; }
.src { font: 12px/1.45 var(--serif); color: var(--muted); padding-left: 8px; border-left: 2px solid var(--rule); overflow-wrap: anywhere; }
.src.missing { border-left-color: var(--warn); color: var(--warn); font-family: var(--sans); }
.hint-line { font-size: 12px; color: var(--muted); font-weight: 400; }

.ledger { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ledger td { padding: 5px 0; border-top: 1px solid var(--rule); vertical-align: top; }
.ledger td:last-child { text-align: right; white-space: nowrap; padding-left: 12px; }
.ledger tr.sum td { border-top: 2px solid var(--ink); font-weight: 600; }
.ledger tr.income td { border-top: 0; }
.ledger .sub { color: var(--muted); font-size: 12px; display: block; }
.big { display: grid; gap: 2px; padding: 12px 14px; border-radius: 6px; background: var(--paper); border: 1px solid var(--rule); }
.big .label { font-size: 12px; color: var(--muted); }
.big .value { font: 600 26px/1.15 var(--sans); font-variant-numeric: tabular-nums; }
.big.good .value { color: var(--good); }
.big.bad .value { color: var(--bad); }
.statute .para { display: grid; grid-template-columns: 1.4em minmax(0, 1fr); gap: 0 6px; font: 14px/1.55 var(--serif); }
.statute .n { font: 600 11px/2 var(--sans); color: var(--muted); text-align: right; }

  // ── language ──
  let lang = 'de';

  const listeners = [];
  function setStrings(page) { for (const l of LANGS) strings[l] = { ...SHARED[l], ...SITE[l], ...((page && page[l]) || {}) }; }
  function lookup(l, key) {
    const s = strings[l];
    if (!s) return undefined;

  }

  // claude.ai: a setup card above the work area when this viewer cannot reach the
  // connector, decided before the first click rather than after a failed call.
  let setup = null; // null | 'none' | 'missing' | 'reauth'
  function renderFrame() {
    if (MODE === 'web') {
      let bar = document.getElementById('ocl-bar');
      if (!bar) { bar = el('nav', 'ocl-bar'); bar.id = 'ocl-bar'; document.body.prepend(bar); }

    if (!setup) { if (card) card.remove(); return; }
    if (!card) {

    else {

      if (setup === 'missing') {

        steps.append(el('li', null, t('setup_1')), el('li', null, t('setup_2')), el('li', null, t('setup_3')));

  async function checkSetup() {

        const listed = await m.listTools(SERVER);

        if (!s || !Array.isArray(s.tools) || !s.tools.length) state = 'missing';

  }

  // The citation_string_* field in the interface language; English reads the German one.
  const citationOf = (p) => (p && (p['citation_string_' + lang] || p.citation_string_de || p.citation_string)) || '';
  const toolLang = () => (lang === 'en' ? 'de' : lang);

  // ── the connector ──
  // Two builds of every page (build.py): 'artifact' runs in claude.ai and calls the
  // viewer's own connector; 'web' runs on opencaselaw.ch and sends the same MCP call
  // to the public server itself, so both see the same answers.
  let connector = null;
  const mcp = () => (connector ||= (MODE === 'web' ? Promise.resolve(webConnector())
    : window.claude && typeof window.claude.use === 'function'
      ? window.claude.use('mcp').catch(() => null) : Promise.resolve(null)));

  // The public server speaks MCP over plain HTTP with open CORS and no session
  // (checked 2026-11-04): one JSON-RPC tools/call, answered as JSON or as a short
  // event stream. The result is shaped as the viewer shapes it: `payload` is
  // structuredContent, else the text parsed as JSON, else the text.
  function webConnector() {
    const cache = new Map();
    let seq = 0;
    async function callTool(server, tool, input, options = {}) {
      const key = tool + '\u0000' + JSON.stringify(input);
      const staleTime = options.cache && options.cache.staleTime;
      const hit = staleTime && cache.get(key);
      if (hit && Date.now() - hit.at < staleTime) return hit.value;
      const id = ++seq;
      const abort = new AbortController();
      const timer = setTimeout(() => abort.abort(), 120000);
      let response;
      let body;
      try {
        response = await fetch(ENDPOINT, {
          method: 'POST', signal: abort.signal,
          headers: { 'content-type': 'application/json', accept: 'application/json, text/event-stream', 'x-client': 'web-tools' },
          body: JSON.stringify({ jsonrpc: '2.0', id, method: 'tools/call', params: { name: tool, arguments: input } }),
        });
        body = await response.text();
      } catch (error) {
        throw { code: 'server_unavailable', message: String((error && error.message) || error), retryable: true };
      } finally { clearTimeout(timer); }
      if (response.status === 429) throw { code: 'rate_limited', message: 'HTTP 429' };
      if (!response.ok) throw { code: 'server_unavailable', message: 'HTTP ' + response.status, retryable: true };
      const message = rpcMessage(body, id);
      if (!message) throw { code: 'server_unavailable', message: 'no answer', retryable: true };
      if (message.error) throw { code: 'tool_error', message: String(message.error.message || 'error').slice(0, 300) };
      const r = message.result || {};
      const blocks = Array.isArray(r.content) ? r.content : [];
      const first = (blocks.find((b) => b && b.type === 'text') || {}).text || '';
      if (r.isError) throw { code: 'tool_error', message: first.slice(0, 300), result: r };
      let payload = r.structuredContent;
      if (payload === undefined) { try { payload = JSON.parse(first); } catch { payload = first; } }
      const value = { content: blocks, structuredContent: r.structuredContent, payload };
      if (staleTime) cache.set(key, { at: Date.now(), value });
      return value;
    }
    return { callTool };
  }
  function rpcMessage(body, id) {
    const text = String(body || '').trim();
    const candidates = text.startsWith('{') ? [text]
      : text.split(/\r?\n\r?\n/).map((event) => event.split(/\r?\n/).filter((l) => l.startsWith('data:')).map((l) => l.slice(5).trimStart()).join('\n')).filter(Boolean);
    for (const c of candidates) {
      try { const m = JSON.parse(c); if (m && m.id === id && (m.result || m.error)) return m; } catch { /* not this one */ }
    }
    return null;
  }

  // One tool call; resolves the JSON payload, rejects with the platform's error object.
  // `text: true` for the few tools that answer in Markdown rather than JSON.
  async function call(tool, input, { staleTime = 600000, text = false } = {}) {
    const m = await mcp();
    if (!m) throw { code: 'unavailable', message: 'no viewer' };
    const result = await m.callTool(SERVER, tool, input, staleTime ? { cache: { staleTime, gcTime: Math.max(staleTime, 300000) } } : { cache: false });
    const p = result && result.payload;
    if (text) {
      const s = typeof p === 'string' ? p : ((result && result.content) || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n');
      if (!s) throw { code: 'tool_error', message: 'empty answer' };
      return s;
    }
    const obj = asObject(p, result);
    if (!obj) throw { code: 'tool_error', message: typeof p === 'string' ? p.slice(0, 300) : 'empty answer' };
    return guard(obj);
  }

  // The server may follow its JSON with a note in the same text block ("---\nℹ️ This
  // data is provided by OpenCaseLaw.ch …", seen 2026-10-29 over plain JSON-RPC); then
  // the platform cannot parse it and hands over text. The object is taken out of it.
  function asObject(p, result) {
    if (p && typeof p === 'object') return p;
    const text = typeof p === 'string' ? p : ((result && result.content) || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n');
    const i = text.indexOf('{');
    const j = text.lastIndexOf('}');
    if (i < 0 || j <= i) return null;
    try { return JSON.parse(text.slice(i, j + 1)); } catch { /* try the text before a trailing note */ }
    const cut = text.search(/\n-{3,}\s*\n/);
    if (cut > i) { try { return JSON.parse(text.slice(i, cut).trim()); } catch { return null; } }
    return null;
  }

  function guard(p) {
    if (p.error && !p.ok && Object.keys(p).length <= 3) throw { code: 'tool_error', message: String(p.error).slice(0, 300) };
    return p;
  }

  async function permissionState() {
    try {
      const permissions = window.claude && await window.claude.use('permissions');
      if (!permissions) return null;
      let state = await permissions.state('mcp:' + SERVER);
      if (state === 'unavailable') state = await permissions.state('mcp');
      return state;
    } catch { return null; }
  }

  // A failed call, kept as data so its sentence follows a later change of language.
  // Closing claude.ai's permission prompt refuses nothing: the call fails with
  // upstream_error ("connector access isn't confirmed for this artifact right now",
  // seen 2026-10-29) and the permission stays "prompt". So before saying anything the
  // page asks the permissions capability: "denied" is a refusal (the panel undoes it),
  // "prompt" means not allowed yet (trying again asks again).
  async function failure(error) {
    const code = (error && error.code) || 'upstream_error';
    let denied = ['not_in_manifest', 'not_granted', 'consent_required', 'approval_required'].includes(code);
    let pending = false;
    if (!denied && code !== 'unavailable') {
      const state = await permissionState();
      denied = state === 'denied';
      pending = state === 'prompt';
    }
    return { code, denied, pending, message: (error && error.message) || String(error) };
  }

  function errorText(e) {
    if (e.denied) return t('e_denied');
    if (e.pending) return t('e_pending');
    if (e.code === 'unavailable') return t('e_unavailable');
    if (['server_not_connected', 'server_not_found', 'selection_required'].includes(e.code)) return t('e_connect');
    if (e.code === 'blocked_by_policy') return t('e_policy');
    if (e.code === 'needs_reauth') return t('e_reauth');
    if (e.code === 'rate_limited') return t('e_busy');
    if (['server_unavailable', 'upstream_error', 'cancelled'].includes(e.code)) return t('e_server');

  }

  // The error, its code for support, and the one way forward: the Permissions panel for
  // a refusal, otherwise trying again (never on its own).
  function renderError(e, retry, rerender) {

      row.append(button('quiet', t('retry'), retry));

  }

  // Copy on a click; where the host refuses the clipboard, the text is selected instead.
  async function copy(text, fallback) {
    try {

      await Promise.race([navigator.clipboard.writeText(text), new Promise((resolve, reject) => setTimeout(() => reject(new Error('timeout')), 1500))]);
      return true;
    } catch {
      if (fallback) { fallback.hidden = false; fallback.value = text; fallback.focus(); fallback.select(); }
      return false;
    }
  }

  // ── Markdown from the tools, as DOM nodes only ──
  // Several tools answer in Markdown. This reads the few forms they use (headings, lists,
  // quotes, rules, **bold**, *italic*, `code`, [text](https link), ^superscript) and builds
  // nodes with textContent, so nothing in the answer is ever parsed as HTML. The server's
  // closing note ("---" then "ℹ️ …") is left out.
  function stripNote(text) {
    const s = String(text || '');
    const cut = s.search(/\n-{3,}\s*\n\s*ℹ️/);
    return cut >= 0 ? s.slice(0, cut) : s;
  }
  function inline(text, into) {
    const re = /\*\*([^*]+)\*\*|\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|`([^`]+)`|(?<![\w*])\*([^*\s][^*]*?)\*(?!\w)|\^(\d+[a-z]?)/g;
    let at = 0;
    for (const m of text.matchAll(re)) {
      if (m.index > at) into.append(text.slice(at, m.index));
      if (m[1] !== undefined) into.append(el('strong', null, m[1]));
      else if (m[2] !== undefined) into.append(link(m[3], m[2]));
      else if (m[4] !== undefined) into.append(el('code', null, m[4]));
      else if (m[5] !== undefined) into.append(el('em', null, m[5]));
      else if (m[6] !== undefined) into.append(el('sup', null, m[6]));
      at = m.index + m[0].length;
    }
    if (at < text.length) into.append(text.slice(at));
    return into;
  }
  function markdown(text, { skipFirstHeading = false } = {}) {
    const box = el('div', 'md');
    let list = null;
    let para = null;
    let headingSeen = false;
    const close = () => { list = null; para = null; };
    for (const raw of stripNote(text).split('\n')) {
      const line = raw.replace(/\s+$/, '');
      const h = /^(#{1,4})\s+(.*)$/.exec(line);
      const li = /^\s*(?:[-*•]|\d+\.)\s+(.*)$/.exec(line);
      if (!line.trim()) { close(); continue; }
      if (h) {
        close();
        if (skipFirstHeading && !headingSeen) { headingSeen = true; continue; }
        headingSeen = true;
        box.append(inline(h[2], el(h[1].length <= 1 ? 'h3' : 'h4', 'md-h')));
      } else if (/^-{3,}$/.test(line.trim())) { close(); box.append(el('hr', 'md-hr')); }
      else if (/^>\s?/.test(line)) { close(); box.append(inline(line.replace(/^>\s?/, ''), el('blockquote', 'md-quote'))); }
      else if (li) {
        para = null;
        if (!list) { list = el(/^\s*\d+\./.test(line) ? 'ol' : 'ul', 'md-list'); box.append(list); }
        list.append(inline(li[1], el('li')));
      } else if (list && /^\s{2,}\S/.test(raw)) {
        const last = list.lastElementChild;
        last.append(el('br'));
        inline(line.trim(), last);
      } else {
        list = null;
        if (!para) { para = el('p', 'md-p'); box.append(para); } else para.append(el('br'));
        inline(line.trim(), para);
      }

  }

  function examples(key, onPick) {

  }

  const rich = (text, into) => inline(String(text || ''), into || el('span'));

  return { LANGS, SERVER, MODE, BUILD, setStrings, t, setLang, initLang, onLang, language, citationOf, toolLang,

// Existenzminimum-Rechner: the betreibungsrechtliche Existenzminimum (Notbedarf, Art. 93
// SchKG) as the cantonal guidelines reckon it: basic amount for the household and its
// children, plus the actual costs the guidelines admit; what the income exceeds it by is
// what can be garnished. The basic amounts are read, at the viewer's request, from the
// canton's own guideline in the corpus (search_practice / get_practice, source bj_schkg)
// and shown with the passage they come from; where the corpus has no readable guideline
// the viewer enters them. The reckoning runs in the page; nothing entered leaves it.
const { t, el, button } = OCL;

const $ = (id) => document.getElementById(id);
const state = { canton: '', guides: null, guide: null, busy: false, error: null, amounts: {}, sources: {}, law: null, run: 0 };

// ── reading the amounts from a guideline ──────────────────────────────────
// The guidelines follow the conference's model text ("1.1 alleinstehender Schuldner Fr. 1'200.00",
// "débiteur vivant seul Fr. 1 200.–"). An amount is taken only where its label stands
// right before it; each comes with the passage it was read from.
const AMT = "(?:Fr\\.?|CHF)\\s*([0-9][0-9'’ ]{0,6}(?:[.,][0-9–-]{1,2})?)";
const LABELS = {
  single: ["alleinstehende[rn]?\\s+(?:Schuldner(?:in)?|Person)", "(?:débit(?:eur|rice)|personne)\\s+(?:vivant\\s+)?seule?"],
  parent: ["allein\\s*erziehende[rn]?\\s+(?:Schuldner(?:in)?|Person)", "(?:débit(?:eur|rice)|parent)\\s+monoparental(?:e)?|famille monoparentale"],
  couple: ["Ehepaar", "couple\\s+mari[ée]"],
  kid10: ["Kind(?:es|er)?\\b[^.;]{0,40}?bis\\s+(?:zu[mr]?\\s+)?(?:vollendeten\\s+)?10\\.?\\s+(?:Alters)?[Jj]ahr", "enfant[^.;]{0,30}?jusqu.{0,4}10\\s+ans"],
  kid11: ["Kind(?:es|er)?\\b[^.;]{0,40}?über\\s+10\\s+[Jj]ahre", "enfant[^.;]{0,30}?(?:plus\\s+de|dès)\\s+10\\s+ans"],
};
function readAmounts(markdown) {
  const body = OCL.stripNote(markdown).split(/\n-{3,}\s*\n/).slice(1).join('\n') || OCL.stripNote(markdown);
  if (/Textlayer fehlt/i.test(body) || body.replace(/\s+/g, ' ').length < 600) return { scanned: true, amounts: {}, sources: {} };
  const flat = body.replace(/\s+/g, ' ');
  const amounts = {}; const sources = {};
  for (const [key, labels] of Object.entries(LABELS)) {
    for (const lab of labels) {
      const m = new RegExp('(' + lab + ')[^0-9]{0,90}?' + AMT, 'iu').exec(flat);
      if (!m) continue;
      const value = Number(m[2].replace(/['’ ]/g, '').replace(',', '.').replace(/[–-]+$/, '').replace(/\.$/, ''));
      if (!(value > 0 && value < 10000)) continue;
      amounts[key] = Math.round(value);
      sources[key] = flat.slice(Math.max(0, m.index - 20), m.index + m[0].length).trim();
      break;
    }
  }
  return { scanned: false, amounts, sources };
}

// "1. [BJ] SZ Richtlinien 1 — Richtlinien … (2009-12-07)\n   doc_id: …\n   PDF: [..](url)"
function parseGuides(text) {
  const out = [];
  for (const block of OCL.stripNote(text).split(/\n(?=\d+\.\s+\[)/)) {
    const head = /^\d+\.\s+\[[^\]]+\]\s+(.+?)\s+—\s+(.+?)\s*$/m.exec(block);
    const id = /doc_id:\s*(\S+)/.exec(block);
    if (!head || !id) continue;
    const canton = (/^([A-Z]{2})\s/.exec(head[1]) || [])[1];
    if (!canton || !CANTONS.includes(canton)) continue;
    out.push({ canton, docId: id[1], number: head[1], title: head[2].replace(/\s*\(\d{4}-\d{2}-\d{2}\)\s*$/, ''), date: (/\((\d{4}-\d{2}-\d{2})\)\s*$/.exec(head[2]) || [])[1] || '',
      pdf: (/PDF:\s*\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/.exec(block) || [])[1] || '' });
  }
  return out;
}

async function chooseCanton(canton) {
  const run = ++state.run;
  Object.assign(state, { canton, guide: null, error: null, busy: Boolean(canton), amounts: {}, sources: {} });
  render();
  if (!canton) return;
  try {
    if (!state.guides) {
      const text = await OCL.call('search_practice', { query: '"betreibungsrechtlichen Existenzminimums" OR "Existenzminimum" OR "minimum vital"', source: 'bj_schkg', limit: 50 }, { text: true, staleTime: 3600000 });
      state.guides = parseGuides(text);
    }
    if (run !== state.run) return;
    // The canton's documents, newest first; the first one whose amounts can be read wins.
    const mine = state.guides.filter((g) => g.canton === canton).sort((a, b) => b.date.localeCompare(a.date));
    let chosen = null;
    let scanned = null;
    for (const g of mine) {
      const text = await OCL.call('get_practice', { doc_id: g.docId }, { text: true, staleTime: 3600000 });
      if (run !== state.run) return;
      const read = readAmounts(text);
      if (read.scanned) { scanned = scanned || g; continue; }
      if (Object.keys(read.amounts).length >= 2) { chosen = { ...g, ...read }; break; }
    }
    state.guide = chosen || (scanned ? { ...scanned, scanned: true, amounts: {}, sources: {} } : { none: true });
    state.amounts = { ...(chosen ? chosen.amounts : {}) };
    state.sources = { ...(chosen ? chosen.sources : {}) };
  } catch (error) {
    const e = await OCL.failure(error);
    if (run !== state.run) return;
    state.error = e;
  }
  state.busy = false;
  render();
  if (!state.law) loadLaw();
}

async function loadLaw() {
  state.law = { busy: true };
  renderLaw();
  try { state.law.data = await OCL.call('get_law', { abbreviation: 'SchKG', article: '93', language: OCL.toolLang() }); } catch (error) { state.law.error = await OCL.failure(error); }
  state.law.busy = false;
  renderLaw();
}

// ── form ──────────────────────────────────────────────────────────────────
function moneyField(id, label, hint, value, onInput) {
  const f = el('label', 'field');
  f.htmlFor = id;
  const head = el('span', null, label);
  if (hint) head.append(el('span', 'hint-line block', hint));
  const wrap = el('span', 'money');
  const input = el('input');
  Object.assign(input, { type: 'number', id, min: 0, step: 1, inputMode: 'decimal' });
  if (value !== undefined && value !== null && value !== '') input.value = value;
  input.addEventListener('input', () => onInput(input.value === '' ? null : Number(input.value)));
  wrap.append(input);
  f.append(head, wrap);
  return f;
}

const values = {};
const num = (v) => (Number.isFinite(v) && v > 0 ? v : 0);

function renderAmounts() {
  const box = $('amounts');
  const keep = document.activeElement && document.activeElement.id;
  const household = $('household').value;
  const parts = [el('legend', 'eyebrow', t('lg_amounts'))];
  const keys = ['a_' + household, 'a_kid10', 'a_kid11'];
  const map = { ['a_' + household]: household, a_kid10: 'kid10', a_kid11: 'kid11' };
  for (const k of keys) {
    const key = map[k];
    if ((key === 'kid10' && !num(Number($('kids10').value))) || (key === 'kid11' && !num(Number($('kids11').value)))) continue;
    parts.push(moneyField('amt-' + key, t(k), null, state.amounts[key], (v) => { state.amounts[key] = v; renderResult(); }));
    if (state.sources[key]) {
      const s = el('p', 'src');
      s.append(t('from_guide') + ' «' + state.sources[key] + '»');
      parts.push(s);
    } else if (state.guide && !state.guide.none && !state.guide.scanned && !num(state.amounts[key])) {
      parts.push(el('p', 'src missing', t('missing')));
    }
  }
  box.replaceChildren(...parts);
  if (keep && document.getElementById(keep)) document.getElementById(keep).focus();
}

function renderCosts() {
  if ($('costs').childNodes.length) return;      // built once; values live in the inputs
  const parts = [el('legend', 'eyebrow', t('lg_costs'))];
  for (const c of COSTS) parts.push(moneyField('cost-' + c, t('c_' + c), t('c_' + c + '_h'), values[c], (v) => { values[c] = v; renderResult(); }));
  $('costs').replaceChildren(...parts);
}

function renderGuide() {
  const box = $('guide');
  const parts = [];
  if (state.busy) parts.push(el('p', 'busy', t('guide_busy')));
  else if (state.error) parts.push(OCL.renderError(state.error, () => chooseCanton(state.canton), render));
  else if (state.guide) {
    const g = state.guide;
    const bj = OCL.link(BJ_LIST, t('bj_list'));
    if (g.none) { const p = el('p', 'note'); p.append(t('guide_none') + ' ', bj); parts.push(p); }
    else if (g.scanned) { const p = el('p', 'note'); p.append(t('guide_scan') + ' '); if (g.pdf) p.append(OCL.link(g.pdf, t('guide_pdf')), ' · '); p.append(bj); parts.push(p); }
    else {
      const p = el('p');
      p.append(t('guide_found', { title: g.title, date: OCL.date(g.date) }) + ' ');
      if (g.pdf) p.append(OCL.link(g.pdf, t('guide_pdf')));
      parts.push(p);
      if (g.date && g.date < '2009-01-01') parts.push(el('p', 'note', t('guide_old', { date: OCL.date(g.date) })));
      const household = $('household').value;
      const needed = [household, ...(num(Number($('kids10').value)) ? ['kid10'] : []), ...(num(Number($('kids11').value)) ? ['kid11'] : [])];
      if (needed.some((k) => !num(state.amounts[k]))) parts.push(el('p', 'note', t('guide_partial')));
    }
  }
  box.replaceChildren(...parts);
}

// ── the reckoning ─────────────────────────────────────────────────────────
function renderResult() {
  const household = $('household').value;
  const k10 = Math.max(0, Math.floor(Number($('kids10').value) || 0));
  const k11 = Math.max(0, Math.floor(Number($('kids11').value) || 0));
  const basic = state.amounts[household];
  const kidAmt = k10 * num(state.amounts.kid10) + k11 * num(state.amounts.kid11);
  const missing = !num(basic) || (k10 && !num(state.amounts.kid10)) || (k11 && !num(state.amounts.kid11));
  const rows = [[t('r_basic') + ' (' + t(household) + ')', num(basic)]];
  if (k10 || k11) rows.push([t('r_kids', { a: k10, b: k11 }), kidAmt]);
  for (const c of COSTS) if (num(values[c])) rows.push([t('c_' + c), num(values[c])]);
  const need = rows.reduce((n, r) => n + r[1], 0);
  const chf = (v) => 'CHF ' + OCL.num(Math.round(v));
  if (!need) {
    $('result').replaceChildren(el('h2', 'h', t('result_title')), el('p', 'muted', t('r_empty')), el('p', 'small muted', t('privacy')));
    return;
  }
  const table = el('table', 'ledger');
  const body = el('tbody');
  for (const [label, v] of rows) { const tr = el('tr'); tr.append(el('td', null, label), el('td', null, chf(v))); body.append(tr); }
  const sum = el('tr', 'sum'); sum.append(el('td', null, t('r_need')), el('td', null, chf(need))); body.append(sum);
  table.append(body);
  const parts = [el('h2', 'h', t('result_title')), table];
  if (missing) parts.push(el('p', 'note', t('r_missing')));
  const income = Number($('income').value);
  if (num(income)) {
    const free = income - need;
    const big = el('div', 'big ' + (free > 0 ? 'bad' : 'good'));
    big.append(el('span', 'label', t('r_income') + ' ' + chf(income)), el('span', 'label', free > 0 ? t('r_free') : t('r_free_none')), el('span', 'value', free > 0 ? chf(free) : chf(0)));
    if (free <= 0) big.append(el('span', 'label', t('r_free_note')));
    parts.push(big);
  } else parts.push(el('p', 'small muted', t('r_need_only')));
  parts.push(el('p', 'note small', t('r_caveat')), el('p', 'small muted', t('privacy')));
  $('result').replaceChildren(...parts);
}

function renderLaw() {
  const box = $('law');
  const parts = [el('h2', 'h', t('law_title'))];
  const L = state.law;
  if (!L) parts.push(button('quiet', t('law_load'), loadLaw));
  else if (L.busy) parts.push(el('p', 'busy', t('law_busy')));
  else if (L.error) parts.push(OCL.renderError(L.error, loadLaw, renderLaw));
  else {
    const a = (L.data.articles || [])[0];
    const st = el('div', 'statute stack');
    for (const line of String((a && a.text) || '').split('\n').filter((x) => x.trim())) {
      const m = /^(\d+[a-z]*)\s+(.*)$/.exec(line);
      const p = el('div', 'para');
      p.append(el('span', 'n', m ? m[1] : ''), el('span', null, m ? m[2] : line));
      st.append(p);
    }
    parts.push(st);
    if (L.data.source_url) parts.push(OCL.link(L.data.source_url, t('law_fedlex')));
  }
  box.replaceChildren(...parts);
}

function render() { renderGuide(); renderAmounts(); renderCosts(); renderResult(); renderLaw(); }

function renderChrome() {
  document.title = 'Existenzminimum-Rechner';
  $('brand').textContent = t('brand');
  $('intro').textContent = t('intro');
  OCL.langButtons($('langs'));
  $('canton-label').textContent = t('canton_label');
  const sel = $('canton');
  sel.replaceChildren(el('option', null, t('canton_manual')), ...CANTONS.map((c) => el('option', null, c)));
  sel.options[0].value = '';
  sel.value = state.canton;
  $('lg-household').textContent = t('lg_household');
  $('household-label').textContent = t('household_label');
  for (const o of $('household').options) o.textContent = t(o.value);
  $('kids10-label').textContent = t('kids10_label');
  $('kids11-label').textContent = t('kids11_label');
  $('lg-income').textContent = t('lg_income');
  $('income-label').textContent = t('income_label');
  $('foot').textContent = t('foot');
  $('costs').replaceChildren();                  // labels change with the language
}

function start() {
  $('canton').addEventListener('change', () => chooseCanton($('canton').value));
  for (const id of ['household', 'kids10', 'kids11']) $(id).addEventListener('input', () => { renderGuide(); renderAmounts(); renderResult(); });
  $('income').addEventListener('input', renderResult);
  $('form').addEventListener('submit', (ev) => ev.preventDefault());
  OCL.onLang(() => { renderChrome(); render(); });
  OCL.initLang();
}

start();

</script>
</body>
</html>
