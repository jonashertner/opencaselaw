<style>
/* OpenCaseLaw artifacts: one family with citecheck (its palette and faces).
   Layout: a slim masthead band, then a centred work area of one or two columns. */
:root {
  --frame: #ebe9e4;
  --ground: #f6f5f2;
  --paper: #ffffff;
  --ink: #20252a;
  --muted: #59636d;
  --rule: #dddeda;
  --rule-strong: #808892;
  --action: #244d72;
  --action-ink: #ffffff;
  --good: #236746;
  --warn: #8a5400;
  --bad: #b0352b;
  --wash-good: #e6f1ea;
  --wash-warn: #f7efdd;
  --wash-bad: #faece9;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --frame: #171a1d; --ground: #1e2226; --paper: #272c31; --ink: #f0eee8; --muted: #b1b7bd;
    --rule: #3a4147; --rule-strong: #73808d; --action: #9ec2e6; --action-ink: #17222d;
    --good: #85c7a3; --warn: #e4b45f; --bad: #f28d83;
    --wash-good: #22302a; --wash-warn: #332d22; --wash-bad: #382928;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --frame: #171a1d; --ground: #1e2226; --paper: #272c31; --ink: #f0eee8; --muted: #b1b7bd;
  --rule: #3a4147; --rule-strong: #73808d; --action: #9ec2e6; --action-ink: #17222d;
  --good: #85c7a3; --warn: #e4b45f; --bad: #f28d83;
  --wash-good: #22302a; --wash-warn: #332d22; --wash-bad: #382928;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--frame); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
p, h1, h2, h3, ol, ul, dl, dd, figure, blockquote { margin: 0; padding: 0; }
ol, ul { list-style: none; }
a { color: var(--action); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { text-wrap: balance; }

/* ── masthead ── */
.site { border-bottom: 1px solid var(--rule); padding-block: 14px 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.site-in { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; }
.brand { font: 600 19px/1.25 var(--serif); letter-spacing: 0.005em; min-width: 0; overflow-wrap: anywhere; }
.brand small { display: inline-block; }
.brand small { font: 500 12px/1 var(--sans); color: var(--muted); margin-left: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
.intro { grid-column: 1 / -1; color: var(--muted); max-width: 72ch; }
.langs { display: flex; }
.lang { border: 0; background: none; padding: 0 6px; min-height: 30px; min-width: 28px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.lang[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }

/* ── work area ── */
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
.wrap.single { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--ground); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; min-width: 0; }
.panel + .panel { margin-top: 0; }
.stack { display: grid; gap: 12px; min-width: 0; }
.h { font: 600 15px/1.3 var(--sans); }
.eyebrow { font: 600 11px/1.3 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.serif { font-family: var(--serif); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.spread { justify-content: space-between; }

/* ── controls ── */
label.field { display: grid; gap: 4px; font-weight: 600; }
textarea, input[type="text"], input[type="search"], input[type="number"], select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--paper); color: var(--ink); font-weight: 400; }
textarea { resize: vertical; font: 15px/1.55 var(--serif); }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 500; }
.check input { margin-top: 3px; }
.primary { border: 0; border-radius: 4px; padding: 9px 16px; min-height: 38px; cursor: pointer; background: var(--action); color: var(--action-ink); font-weight: 600; }
.primary:disabled { opacity: 0.45; cursor: default; }
.quiet { border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 11px; min-height: 32px; background: var(--paper); cursor: pointer; }
.quiet:hover:not(:disabled) { border-color: var(--ink); }
.quiet:disabled { opacity: 0.55; cursor: default; }
.link { border: 0; padding: 0; background: none; color: var(--action); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* ── states ── */
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-good { color: var(--good); box-shadow: inset 0 0 0 1.5px var(--good); }
.pill-warn { color: var(--warn); background: var(--wash-warn); }
.pill-bad { color: var(--bad); background: var(--wash-bad); }
.pill-plain { color: var(--muted); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.alert { padding: 8px 10px; border-left: 3px solid var(--bad); background: var(--wash-bad); border-radius: 0 4px 4px 0; }
.note { padding: 8px 10px; border-left: 3px solid var(--rule-strong); background: var(--paper); border-radius: 0 4px 4px 0; color: var(--muted); }
.error-line { color: var(--bad); }
.code { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.busy { color: var(--muted); }
.busy::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-left: 8px; border: 2px solid var(--rule-strong); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .busy::after { animation: none; } }
.empty { padding: 8px 0; }
.empty p { margin-top: 6px; color: var(--muted); max-width: 60ch; }
.excerpt { margin-top: 4px; padding: 4px 10px; border-left: 2px solid var(--rule-strong); font: 14px/1.55 var(--serif); overflow-wrap: anywhere; }
.cite { font-family: var(--serif); overflow-wrap: anywhere; }
.num { font-variant-numeric: tabular-nums; }

/* ── foot ── */
.foot { max-width: 1120px; margin: 0 auto; padding-block: 0 24px; color: var(--muted); font-size: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ── Markdown from the tools ── */
.md { display: grid; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.md-h { font: 600 14px/1.35 var(--sans); margin-top: 6px; }
h3.md-h { font-size: 15px; }
.md-p { max-width: 75ch; }
.md-list { display: grid; gap: 6px; padding-left: 0; }
.md-list > li { padding-left: 12px; border-left: 2px solid var(--rule); }
ol.md-list { list-style: none; }
.md-quote { padding: 4px 10px; border-left: 2px solid var(--rule-strong); font-family: var(--serif); }
.md-hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; width: 100%; }
.md code { font: 12px/1.4 var(--mono); }

.block { display: block; font-weight: 400; margin-top: 1px; }

/* ── one-click examples on a first view ── */
.examples { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.chip-btn { border: 1px solid var(--rule-strong); border-radius: 999px; background: var(--paper); padding: 3px 11px; min-height: 28px; cursor: pointer; font-size: 13px; }
.chip-btn:hover { border-color: var(--action); color: var(--action); }
.empty .examples { margin-top: 10px; }

/* ── the frame: setup card in claude.ai, site bar on opencaselaw.ch ── */
.ocl-setup { grid-column: 1 / -1; display: grid; gap: 8px; border-left: 3px solid var(--action); }
.ocl-setup-title { font: 600 15px/1.3 var(--sans); }
.ocl-setup p { max-width: 75ch; }
.ocl-steps { list-style: decimal; padding-left: 22px; display: grid; gap: 4px; max-width: 75ch; }
.ocl-setup-links { margin-top: 4px; }
.button-link { display: inline-block; border-radius: 4px; padding: 7px 14px; background: var(--action); color: var(--action-ink); font-weight: 600; text-decoration: none; }
.button-link:hover { filter: brightness(1.08); }
.ocl-bar { background: var(--paper); border-bottom: 1px solid var(--rule); font-size: 13px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ocl-bar-in { max-width: 1120px; margin: 0 auto; min-height: 40px; display: flex; align-items: center; gap: 8px; }
.ocl-bar a { color: var(--ink); text-decoration: none; }
.ocl-bar a:hover { color: var(--action); text-decoration: underline; }
.ocl-home { font: 600 15px/1 var(--serif); }
.ocl-sep { color: var(--muted); margin: 0 4px; }
.ocl-links { margin-top: 8px; }

[hidden] { display: none !important; }

/* Praxis-Änderungen: documents and their versions on the left; on the right the changes
   between two versions, each passage with its heading, the old words struck through and
   the new ones marked, the unchanged words around them for orientation. */
.doc { display: grid; gap: 3px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); cursor: pointer; text-align: left; width: 100%; }
.doc[aria-pressed="true"] { border-color: var(--action); box-shadow: inset 3px 0 0 var(--action); }
.doc .num { font: 600 13px/1.3 var(--sans); }
.doc .title { font: 14px/1.35 var(--serif); }
.doc .meta { font-size: 12px; color: var(--muted); }
.docs { display: grid; gap: 6px; }

.versions { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); overflow: hidden; }
.vrow { display: grid; grid-template-columns: 3.4em 3.4em minmax(0, 1fr); align-items: center; gap: 6px; padding: 6px 10px; border-top: 1px solid var(--rule); }
.vrow:first-child { border-top: 0; }
.vhead { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.vrow input { margin: 0; justify-self: center; }
.vdate { font-variant-numeric: tabular-nums; }
.vdate .now { margin-left: 6px; }

.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.stats b { font-variant-numeric: tabular-nums; }
.del-n { color: var(--bad); }
.ins-n { color: var(--good); }
.passages { display: grid; gap: 10px; }
.passage { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.passage .where { font-size: 12px; color: var(--muted); }
.passage .text { font: 15px/1.65 var(--serif); overflow-wrap: anywhere; }
.passage .ctx { color: var(--muted); }
del.d { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; background: var(--wash-bad); border-radius: 2px; }
ins.i { color: var(--good); text-decoration: none; background: var(--wash-good); border-radius: 2px; font-weight: 600; }
.pdfs { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
.formal { margin-top: 4px; }

</style>
</head>
<body>
<header class="site">
  <div class="site-in">
    <p class="brand"><span id="brand">Praxis-Änderungen</span><small>OpenCaseLaw</small></p>
    <div class="langs" id="langs"></div>
    <p class="intro" id="intro"></p>
  </div>
</header>
<main class="wrap">
  <div class="stack">

      <label class="field" for="authority"><span id="authority-label"></span>
        <select id="authority"></select>
      </label>
      <button type="submit" class="primary" id="go"></button>
    </form>
    <section class="panel stack" id="docs" aria-live="polite"></section>
  </div>
  <section class="panel stack" id="out" aria-live="polite"></section>
</main>
<footer class="foot"><p id="foot"></p></footer>

// Each step keeps only the slice of V it needs (k from -d-1 to d+1), so memory grows with
// the square of the number of changes, not with the length of the texts.
function diffWords(a, b, maxD = 3000) {
  const A = a.map(norm); const B = b.map(norm);
  let start = 0;
  while (start < A.length && start < B.length && A[start] === B[start]) start++;
  let endA = A.length; let endB = B.length;
  while (endA > start && endB > start && A[endA - 1] === B[endB - 1]) { endA--; endB--; }
  const a1 = A.slice(start, endA); const b1 = B.slice(start, endB);
  const N = a1.length; const M = b1.length; const MAX = N + M;
  const V = new Int32Array(2 * MAX + 2); const trace = [];
  let found = N === 0 && M === 0;
  for (let d = 0; d <= Math.min(MAX, maxD) && !found; d++) {
    trace.push(V.slice(MAX - d - 1, MAX + d + 2));
    for (let k = -d; k <= d; k += 2) {
      let x = (k === -d || (k !== d && V[MAX + k - 1] < V[MAX + k + 1])) ? V[MAX + k + 1] : V[MAX + k - 1] + 1;
      let y = x - k;
      while (x < N && y < M && a1[x] === b1[y]) { x++; y++; }
      V[MAX + k] = x;
      if (x >= N && y >= M) { found = true; break; }
    }
  }
  if (!found) return null;
  // walk back
  const ops = [];
  let x = N; let y = M;
  for (let d = trace.length - 1; d >= 0; d--) {
    const Vd = trace[d]; const k = x - y; const at = (kk) => Vd[kk + d + 1];
    const down = k === -d || (k !== d && at(k - 1) < at(k + 1));
    const pk = down ? k + 1 : k - 1;
    const px = d === 0 ? 0 : at(pk); const py = px - pk;
    while (x > px && y > py) { ops.push(['=', x - 1, y - 1]); x--; y--; }
    if (d > 0) { if (down) ops.push(['+', null, py]); else ops.push(['-', px, null]); }
    x = px; y = py;
  }
  ops.reverse();
  const runs = [];
  const push = (op, word) => { const last = runs[runs.length - 1]; if (last && last.op === op) last.words.push(word); else runs.push({ op, words: [word] }); };
  for (let i = 0; i < start; i++) push('=', a[i]);
  for (const [op, i, j] of ops) push(op, op === '+' ? b[start + j] : a[start + i]);
  for (let i = endA; i < a.length; i++) push('=', a[i]);
  return runs;
}

// Changes with a little context; changes separated by a short unchanged stretch form one
// passage. Each passage names the nearest heading before it ("II. Begriff …").
function hunks(runs, context = 12) {
  const MONTHS = /^(?:Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember|Janvier|Février|Mars|Avril|Juin|Juillet|Août|Septembre|Octobre|Novembre|Décembre|Gennaio|Febbraio|Marzo|Aprile|Maggio|Giugno|Luglio|Agosto|Settembre|Ottobre|Novembre|Dicembre)\b/i;
  const HEAD = /^(?:[IVX]+\.|[A-Z]\.|\d{1,2}\.(?:\d{1,2}\.?)?)$/;
  const out = [];
  let heading = '';
  let current = null;
  const headingIn = (words) => {
    for (let i = 0; i < words.length; i++) {
      if (HEAD.test(words[i]) && /^\p{Lu}/u.test(words[i + 1] || '') && !MONTHS.test(words[i + 1])) heading = [words[i], ...words.slice(i + 1, i + 7)].join(' ');
    }
  };
  for (let r = 0; r < runs.length; r++) {
    const run = runs[r];
    if (run.op === '=') {
      const nextIsChange = r + 1 < runs.length;
      if (current && nextIsChange && run.words.length <= 2 * context) { current.parts.push({ op: '=', words: run.words }); continue; }
      if (current) { current.after = run.words.slice(0, context).join(' '); out.push(current); current = null; }
      headingIn(run.words);
      if (nextIsChange) current = { heading, before: run.words.slice(-context).join(' '), parts: [], after: '' };
      continue;
    }
    if (!current) current = { heading, before: '', parts: [], after: '' };
    current.parts.push({ op: run.op, words: run.words });
  }
  if (current) out.push(current);
  return out;
}

// Formal changes: every changed word is a number, punctuation or a dot leader, and it
// stands by a dot leader, "von"/"de"/"of" (page x of y), a "|" or "Stand:" (header and
// footer lines): a renumbered table of contents, page counters, the date of a running
// head. A changed amount, rate or time limit in the text ("CHF 1200", "15 %", "30 Tage")
// has no such neighbour and stays. stripFormal takes them out of the runs before
// passages are cut, so they neither show nor glue real changes into one long passage.
const FORMAL_WORD = /^(?:[\d.,:;\-–—…|/()]+|\.{3,}\S*|\S*\.{3,})$/;
const LEADER = /\.{3,}|…{2,}/;
const KEY = /^(?:von|de|di|of|sur|su|Seite|page|pagina|Stand:?|Etat:?|État:?|Stato:?|\|)$/i;
function stripFormal(runs) {
  const out = [];
  let formal = 0;
  for (let r = 0; r < runs.length; r++) {
    if (runs[r].op === '=') { out.push(runs[r]); continue; }
    // One change: a "-" run, a "+" run, or "-" then "+".
    let e = r;
    while (e + 1 < runs.length && runs[e + 1].op !== '=' && e - r < 1) e++;
    const group = runs.slice(r, e + 1);
    const words = group.flatMap((g) => g.words);
    const prev = r > 0 && runs[r - 1].op === '=' ? runs[r - 1].words.slice(-3) : [];
    const next = e + 1 < runs.length && runs[e + 1].op === '=' ? runs[e + 1].words.slice(0, 2) : [];
    const ok = words.length > 0 && words.every((w) => FORMAL_WORD.test(w))
      && (words.some((w) => LEADER.test(w)) || [...prev, ...next].some((n) => LEADER.test(n) || KEY.test(n))
        // a page number before the next entry of a table of contents ("… 94 92 8.4 Verfügung")
        || (words.every((w) => /^\d{1,3}$/.test(w)) && /^\d{1,2}(?:\.\d{1,2})+\.?$/.test(next[0] || '')));
    if (ok) {
      formal++;
      const plus = group.find((g) => g.op === '+');
      if (plus) out.push({ op: '=', words: plus.words });
    } else out.push(...group);
    r = e;
  }
  // Join neighbouring "=" runs again.
  const merged = [];
  for (const x of out) {
    const last = merged[merged.length - 1];
    if (last && last.op === '=' && x.op === '=') last.words = last.words.concat(x.words);
    else merged.push({ op: x.op, words: x.words.slice() });
  }
  return { runs: merged, formal };
}

if (typeof module !== 'undefined') module.exports = { bodyOf, tokens, diffWords, hunks, stripFormal };

const $ = (id) => document.getElementById(id);
const state = { authority: 'FINMA', docs: null, docsBusy: false, docsError: null, doc: null, versionsBusy: false, from: null, to: null,
  cmp: null, cmpBusy: false, cmpError: null, shown: 20, run: 0 };

// ── search answers (Markdown) ─────────────────────────────────────────────
// "1. [FINMA] FINMA-RS 2008/21 — 2008/21 FINMA-Rundschreiben "…" (2012-06-01)\n   doc_id: …\n   …snippet…\n   PDF: [..](url)"
function parseSearch(text) {
  const out = [];
  for (const block of OCL.stripNote(text).split(/\n(?=\d+\.\s+\[)/)) {
    const head = /^(\d+)\.\s+\[([^\]]+)\]\s+(.+?)\s+—\s+(.+?)\s*$/m.exec(block);
    const id = /doc_id:\s*(\S+)/.exec(block);
    if (!head || !id) continue;
    const date = (/\((\d{4}-\d{2}-\d{2})\)\s*$/.exec(head[4]) || [])[1] || '';
    const pdf = (/PDF:\s*\[[^\]]*\]\((https?:\/\/[^)\s]+)\)/.exec(block) || [])[1] || '';
    const lang = (/_(de|fr|it|en|rm)$/.exec(id[1]) || [])[1] || '';
    out.push({ authority: head[2], number: head[3].trim(), title: head[4].replace(/\s*\(\d{4}-\d{2}-\d{2}\)\s*$/, '').trim(), date, docId: id[1], pdf, lang });
  }
  return out;
}

function group(entries) {
  // FINMA publishes in English too: the interface language first, else the tools' language.
  const prefs = [OCL.language(), OCL.toolLang()];
  const rank = (g) => { const i = prefs.indexOf(g.lang); return i < 0 ? prefs.length : i; };
  const by = new Map();
  for (const e of entries) {
    const key = e.authority + '|' + e.number + '|' + e.lang;
    const g = by.get(key) || { key, authority: e.authority, number: e.number, title: e.title, lang: e.lang, versions: new Map() };
    if (!g.versions.has(e.docId)) g.versions.set(e.docId, e);
    if (e.date >= ([...g.versions.values()].map((v) => v.date).sort().pop() || '')) g.title = e.title;
    by.set(key, g);
  }
  // One language per document, in the order the search ranked the documents.
  const best = new Map();
  for (const g of by.values()) {
    const k = g.authority + '|' + g.number;
    if (!best.has(k) || rank(g) < rank(best.get(k))) best.set(k, g);
  }
  return [...best.values()];
}
const versionsOf = (g) => [...g.versions.values()].sort((a, b) => b.date.localeCompare(a.date) || b.docId.localeCompare(a.docId));

async function search() {
  const query = $('query').value.trim() || t('query_example');
  $('query').value = query;
  const authority = state.authority;
  const run = ++state.run;
  Object.assign(state, { docsBusy: true, docsError: null, docs: null, doc: null, cmp: null, cmpError: null });
  render();
  try {
    const text = await OCL.call('search_practice', { query, include_superseded: true, limit: 50, ...(authority ? { issuing_authority: authority } : {}) }, { text: true });
    if (run !== state.run) return;
    state.docs = group(parseSearch(text));
  } catch (error) {
    const e = await OCL.failure(error);
    if (run !== state.run) return;
    state.docsError = e;
  }
  state.docsBusy = false;
  render();
}

// The search found some versions; a second search on the document number finds the rest.
async function choose(g) {
  const run = ++state.run;
  Object.assign(state, { doc: g, cmp: null, cmpError: null, versionsBusy: true });
  render();
  try {
    const number = g.number.replace(/^[A-ZÄÖÜ][\w-]*\s+(?=\d)/, '');
    const text = await OCL.call('search_practice', { query: '"' + number.replace(/"/g, '') + '"', include_superseded: true, limit: 50, issuing_authority: g.authority }, { text: true });
    if (run !== state.run) return;
    for (const e of parseSearch(text)) if (e.number === g.number && e.lang === g.lang && !g.versions.has(e.docId)) g.versions.set(e.docId, e);
  } catch { /* the versions already found stand */ }
  if (run !== state.run) return;
  const v = versionsOf(g);
  state.to = v[0] ? v[0].docId : null;
  state.from = v[1] ? v[1].docId : null;
  state.versionsBusy = false;
  render();
}

async function compare() {
  const g = state.doc;
  if (!g || !state.from || !state.to || state.from === state.to) return;
  const [older, newer] = [g.versions.get(state.from), g.versions.get(state.to)].sort((a, b) => a.date.localeCompare(b.date));
  const run = ++state.run;
  Object.assign(state, { cmpBusy: true, cmpError: null, cmp: null, shown: 20, showFormal: false });
  render();
  try {
    const [a, b] = await Promise.all([older, newer].map((v) => OCL.call('get_practice', { doc_id: v.docId }, { text: true, staleTime: 3600000 })));
    if (run !== state.run) return;
    await new Promise((r) => setTimeout(r, 30));            // let "comparing …" paint before the work
    const runs = diffWords(tokens(a), tokens(b));
    const lean = runs ? stripFormal(runs) : null;
    state.cmp = { older, newer, runs, lean: lean ? lean.runs : null, passages: runs ? hunks(lean.runs) : null, all: runs ? hunks(runs) : null, formal: lean ? lean.formal : 0 };
  } catch (error) {
    const e = await OCL.failure(error);
    if (run !== state.run) return;
    state.cmpError = e;
  }
  state.cmpBusy = false;
  render();
}

// An example goes all the way: the first document found with two or more versions,
// its two newest compared. A visitor sees a comparison after one click.
async function showFirst() {
  const g = (state.docs || []).find((d) => d.versions.size >= 2);
  if (!g) return;
  await choose(g);
  if (state.doc === g && state.from && state.to && state.from !== state.to) await compare();
}

// ── rendering ─────────────────────────────────────────────────────────────
function renderDocs() {
  const box = $('docs');
  if (state.docsBusy) { box.replaceChildren(el('p', 'busy', t('docs_busy'))); return; }
  if (state.docsError) { box.replaceChildren(OCL.renderError(state.docsError, search, render)); return; }
  if (!state.docs) {
    box.replaceChildren(el('p', 'small muted', t('docs_hint')), OCL.examples('ex', (x) => {
      const m = /^([A-Z ]+):\s*(.+)$/.exec(x);
      if (m) { state.authority = m[1].trim(); $('authority').value = state.authority; $('query').value = m[2]; search().then(showFirst); }
    }));
    return;
  }
  if (!state.docs.length) { box.replaceChildren(el('p', 'muted', t('docs_none'))); return; }
  const parts = [el('p', 'eyebrow', t('docs_title', { n: OCL.num(state.docs.length) }))];
  const list = el('div', 'docs');
  for (const g of state.docs) {
    const v = versionsOf(g);
    const b = button('doc', null, () => choose(g));
    b.setAttribute('aria-pressed', String(state.doc === g));
    b.append(el('span', 'num', g.authority + ' · ' + g.number), el('span', 'title', g.title), el('span', 'meta', v.length + ' × · ' + v.map((x) => x.date.slice(0, 4)).filter((y, i, a) => a.indexOf(y) === i).slice(0, 6).join(', ')));
    list.append(b);
    if (state.doc === g) list.append(renderVersions(g));
  }
  parts.push(list);
  box.replaceChildren(...parts);
}

function renderVersions(g) {
  const wrap = el('div', 'stack');
  if (state.versionsBusy) { wrap.append(el('p', 'busy small', t('versions_busy'))); return wrap; }
  const v = versionsOf(g);

  const table = el('div', 'versions');
  const head = el('div', 'vrow vhead');
  head.append(el('span', null, t('v_from')), el('span', null, t('v_to')), el('span', null, ''));
  table.append(head);
  v.forEach((x, i) => {
    const row = el('label', 'vrow');
    const from = el('input'); from.type = 'radio'; from.name = 'from'; from.checked = state.from === x.docId; from.setAttribute('aria-label', t('v_from') + ' ' + x.date);
    from.addEventListener('change', () => { state.from = x.docId; render(); });
    const to = el('input'); to.type = 'radio'; to.name = 'to'; to.checked = state.to === x.docId; to.setAttribute('aria-label', t('v_to') + ' ' + x.date);
    to.addEventListener('change', () => { state.to = x.docId; render(); });
    const d = el('span', 'vdate', OCL.date(x.date) || x.docId);
    if (i === 0) d.append(el('span', 'pill pill-plain now', t('v_current')));
    row.append(from, to, d);
    table.append(row);
  });
  wrap.append(table);
  const go = button('primary', state.cmpBusy ? t('comparing') : t('compare'), compare);
  go.disabled = state.cmpBusy || !state.from || !state.to || state.from === state.to;
  wrap.append(go);
  if (state.from === state.to) wrap.append(el('p', 'small muted', t('pick_two')));
  return wrap;
}

function renderCompare() {
  const out = $('out');
  if (state.cmpBusy) { out.replaceChildren(el('p', 'busy', t('comparing'))); return; }
  if (state.cmpError) { out.replaceChildren(OCL.renderError(state.cmpError, compare, render)); return; }
  const c = state.cmp;
  if (!c) {
    const box = el('div', 'empty');
    box.append(el('h2', 'h', t('empty_title')), el('p', null, t('empty_body')));
    out.replaceChildren(box);
    return;
  }
  const parts = [];
  parts.push(el('p', 'eyebrow', c.older.authority + ' · ' + c.older.number));
  parts.push(el('h2', 'h', t('result', { from: OCL.date(c.older.date), to: OCL.date(c.newer.date) })));
  const pdfs = el('p', 'pdfs');
  if (c.older.pdf) pdfs.append(OCL.link(c.older.pdf, t('pdf_from', { date: OCL.date(c.older.date) })));
  if (c.newer.pdf) pdfs.append(OCL.link(c.newer.pdf, t('pdf_to', { date: OCL.date(c.newer.date) })));
  parts.push(pdfs);
  if (!c.runs) { parts.push(el('p', 'alert', t('too_different')), el('p', 'note small', t('caveat'))); out.replaceChildren(...parts); return; }
  const formal = c.formal;
  const shownList = state.showFormal ? c.all : c.passages;
  const shownRuns = state.showFormal ? c.runs : c.lean;
  const del = shownRuns.filter((r) => r.op === '-').reduce((n, r) => n + r.words.length, 0);
  const ins = shownRuns.filter((r) => r.op === '+').reduce((n, r) => n + r.words.length, 0);
  if (!c.all.length) { parts.push(el('p', 'verdict', t('same')), el('p', 'note small', t('caveat'))); out.replaceChildren(...parts); return; }
  const stats = el('p', 'stats');
  stats.append(el('span', null, t('stats_passages', { n: OCL.num(shownList.length) })), el('span', 'del-n', t('stats_del', { n: OCL.num(del) })), el('span', 'ins-n', t('stats_ins', { n: OCL.num(ins) })));
  parts.push(stats);
  if (formal) {
    const row = el('p', 'small muted formal');
    row.append(t('formal_hidden', { n: OCL.num(formal) }) + ' ', button('link', t(state.showFormal ? 'formal_hide' : 'formal_show'), () => { state.showFormal = !state.showFormal; render(); }));
    parts.push(row);
  }
  const list = el('div', 'passages');
  for (const h of shownList.slice(0, state.shown)) {
    const box = el('article', 'passage');
    box.append(el('p', 'where', h.heading ? t('where', { h: h.heading }) : t('where_start')));
    const text = el('p', 'text');
    if (h.before) text.append(el('span', 'ctx', '… ' + h.before + ' '));
    for (const part of h.parts) {
      if (part.op === '=') text.append(part.words.join(' ') + ' ');
      else { text.append(el(part.op === '-' ? 'del' : 'ins', part.op === '-' ? 'd' : 'i', part.words.join(' '))); text.append(' '); }
    }
    if (h.after) text.append(el('span', 'ctx', h.after + ' …'));
    box.append(text);
    list.append(box);
  }
  parts.push(list);
  if (shownList.length > state.shown) parts.push(button('quiet', t('show_more', { n: OCL.num(Math.min(40, shownList.length - state.shown)) }), () => { state.shown += 40; render(); }));
  parts.push(el('p', 'note small', t('caveat')));
  out.replaceChildren(...parts);
}

function render() { renderDocs(); renderCompare(); }

function renderChrome() {
  document.title = 'Praxis-Änderungen';
  $('brand').textContent = t('brand');
  $('intro').textContent = t('intro');
  OCL.langButtons($('langs'));
  $('query-label').textContent = t('query_label');
  $('query').placeholder = t('query_example');
  $('authority-label').textContent = t('authority_label');
  const sel = $('authority');
  sel.replaceChildren(el('option', null, t('any')), ...AUTHORITIES.map((a) => el('option', null, a)));
  sel.options[0].value = '';
  sel.value = state.authority;
  $('go').textContent = t('go');
  $('foot').textContent = t('foot');
}

function start() {
  $('form').addEventListener('submit', (ev) => { ev.preventDefault(); search(); });
  $('authority').addEventListener('change', () => { state.authority = $('authority').value; });
  OCL.onLang(() => { renderChrome(); render(); });
  OCL.initLang();
  if (!$('query').value) $('query').value = t('query_example');
}

start();

</script>
</body>
