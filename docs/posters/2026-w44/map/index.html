<style>
/* One look on purpose, the Rumantsch poster's: paper, ink, one red.
   Layout: the sheet runs edge to edge; the figure stands top left, the courts top right, and the
   cantons are set as a plain index of names and figures along the foot. */
:root{--paper:#f1ede3;--ink:#101010;--red:#e0301e;--mute:#8d887c;--g:max(28px,env(safe-area-inset-left,0px));--gr:max(28px,env(safe-area-inset-right,0px));
  --display:'Space Grotesk','Arial Narrow',Arial,sans-serif;--body:'Instrument Sans','Helvetica Neue',Arial,sans-serif;color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.35 var(--body)}
.poster{display:grid;grid-template-rows:minmax(0,1fr) auto auto;height:100%;min-height:640px;overflow:hidden}
.stage{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:crosshair}
.lead{position:absolute;z-index:2;left:var(--g);top:20px;pointer-events:none;display:grid;justify-items:start;isolation:isolate}
.lead{text-shadow:0 0 5px var(--paper),0 0 9px var(--paper)}
#total{position:relative;isolation:isolate;text-shadow:none}
#total::before{content:"";position:absolute;inset:-4px -24px -2px -40px;background:var(--paper);filter:blur(13px);z-index:-1}
.tabs{pointer-events:auto;display:flex;gap:20px;margin-bottom:10px}
.tabs button{all:unset;cursor:pointer;font:600 15px/1 var(--body);padding:3px 0 6px;border-bottom:2px solid transparent;color:var(--mute);transition:color .2s}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:focus-visible,.row:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#total{font-family:var(--display);font-weight:700;font-size:clamp(68px,min(10.4vw,15vh),146px);line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
#place{font:500 clamp(20px,min(2.3vw,3.2vh),28px)/1.15 var(--display);margin-top:12px;white-space:nowrap}
#sub{font-size:15px;white-space:nowrap;margin-top:2px}
.side{position:absolute;z-index:2;right:var(--gr);top:24px;width:clamp(210px,21vw,290px);pointer-events:none;background:var(--paper);box-shadow:0 0 18px 16px var(--paper)}
#list{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums;animation:in .22s ease-out}
#list li{display:flex;justify-content:space-between;gap:14px;height:22px;white-space:nowrap}
#list li span{min-width:0;overflow:hidden;text-overflow:ellipsis}
#list b{font-weight:600}
#list li.t{display:block;height:auto;white-space:normal;margin-bottom:6px;color:#55514a}
@keyframes in{from{opacity:0}to{opacity:1}}
#tag{position:absolute;z-index:1;left:0;top:0;pointer-events:none;background:var(--ink);color:var(--paper);font:600 13px/1 var(--body);padding:5px 7px;white-space:nowrap;opacity:0;will-change:transform,opacity;transition:opacity .16s,transform .28s cubic-bezier(.2,.8,.2,1)}
#index{position:relative;margin:6px var(--gr) 0 var(--g);transition:opacity .16s}#index.swap{opacity:0}
.row{all:unset;position:absolute;left:0;top:0;width:calc(100%/var(--cols));height:23px;box-sizing:border-box;padding-right:26px;display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer;font-size:14.5px;font-variant-numeric:tabular-nums;transform:translate(calc(var(--c)*100%),calc(var(--r)*23px));transition:opacity .18s;white-space:nowrap}
.row span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.row b{font-weight:600}
.row.zero{color:var(--mute)}
#index.sel .row{opacity:.32}#index.sel .row.on{opacity:1}
.row.on{color:var(--red)}
.foot{display:flex;justify-content:space-between;gap:6px 24px;flex-wrap:wrap;padding:10px var(--gr) 12px var(--g);font-size:12.5px;color:var(--mute)}
.foot a{color:var(--ink)}.foot .note{display:none}
@media (prefers-reduced-motion:reduce){.row,#tag,#index{transition:none}#list{animation:none}}
@media (max-width:980px){
  html,body{height:auto}.poster{display:block;height:auto;overflow:visible}.stage{display:grid}
  .lead,.side{position:static;box-shadow:none;background:none}#total::before{display:none}.lead{padding:16px var(--gr) 0 var(--g)}.side{width:auto;padding:0 var(--gr) 0 var(--g);height:66px;overflow:hidden;font-size:14px}
  #total{font-size:clamp(72px,18vw,120px)}#sub{white-space:normal}
  canvas{position:static;height:auto;aspect-ratio:var(--ratio)}
  #list{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,22px);grid-auto-columns:minmax(0,1fr);gap:0 18px}#list li.t:not(:first-child),#list li:nth-child(n+7){display:none}
  .row{padding-right:16px}.foot .note{display:block}
}
</style>

</div>
<script id="vd" type="x-shader">
attribute vec2 aA,aB;attribute vec4 aI;
uniform vec2 uView,uOff,uBall,uSize;uniform float uMix,uRev,uPress,uR,uSeat,uAny;uniform float uTone[27];
varying float vTone;varying float vS;
const float HILL=.47;
void main(){float wave=aI.w/255.;float m=clamp(uMix*1.45-wave*.45,0.,1.);m=m*m*(3.-2.*m);
 vec2 p=mix(aA,aB,m);vec2 d=p-uBall;float l=length(d);float swell=1.;
 if(l<uR&&l>.001){float r=l/uR,q=1.-r*r,lift=HILL*q*q;p+=d*lift*uPress;swell=1.+min(.3,lift)*uPress;}
 float t=uTone[int(aI.x+.5)];t=max(t,uSeat*aI.z/255.);t=mix(1.,t,uAny);
 float size=mix(uSize.x*aI.y/255.,uSize.y,m)*swell*mix(.72,1.,t);
 float rise=clamp(uRev*1.5-aA.x/8640.*.5,0.,1.);size*=rise*rise*(3.-2.*rise);
 vTone=t;vS=max(size,1.);gl_PointSize=vS;gl_Position=vec4(p*uView+uOff,0.,1.);if(size<.05)gl_Position=vec4(2.,2.,0.,1.);}
</script>
<script id="fd" type="x-shader">
precision mediump float;varying float vTone;varying float vS;uniform vec3 uRed,uDim;
void main(){float r=length(gl_PointCoord-.5);float a=smoothstep(.5,.5-1.4/vS,r);if(a<=0.)discard;vec3 c=mix(uDim,uRed,vTone);gl_FragColor=vec4(c*a,a);}
</script>
<script id="vl" type="x-shader">
attribute vec2 aA,aB;attribute float aF;uniform vec2 uView,uOff,uBall,uNudge;uniform float uMix,uPress,uR;varying float vF;
void main(){vF=aF;float m=uMix*uMix*(3.-2.*uMix);vec2 p=mix(aA,aB,m);vec2 d=p-uBall;float l=length(d);
 if(l<uR&&l>.001){float r=l/uR,q=1.-r*r;p+=d*.47*q*q*uPress;}gl_Position=vec4(p*uView+uOff+uNudge,0.,1.);}
</script>
<script id="fl" type="x-shader">
precision mediump float;uniform vec4 uC;varying float vF;void main(){float a=uC.a*vF;gl_FragColor=vec4(uC.rgb*a,a);}
</script>
