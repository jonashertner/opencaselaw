<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posters — OpenCaseLaw</title>
<meta name="description" content="Every Friday the week in Swiss case law is drawn five ways, one design per language: a relief map, 151 years in lines, a score, colour fields and a receipt. The archive of every week.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://opencaselaw.ch/posters/">
<link rel="alternate" hreflang="de" href="https://opencaselaw.ch/posters/?lang=de">
<link rel="alternate" hreflang="fr" href="https://opencaselaw.ch/posters/?lang=fr">
<link rel="alternate" hreflang="it" href="https://opencaselaw.ch/posters/?lang=it">
<link rel="alternate" hreflang="rm" href="https://opencaselaw.ch/posters/?lang=rm">
<link rel="alternate" hreflang="en" href="https://opencaselaw.ch/posters/?lang=en">
<link rel="alternate" hreflang="x-default" href="https://opencaselaw.ch/posters/">
<meta property="og:title" content="Posters — OpenCaseLaw">
<meta property="og:description" content="The week in Swiss case law, drawn five ways every Friday.">
<meta property="og:image" content="https://opencaselaw.ch/posters/latest/en.webp">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<link rel="stylesheet" href="/static/css/site.css?v=3">
<style>
  .wk{padding:clamp(28px,4vw,44px) 0;border-top:1px solid var(--line)}
  .wk-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:0 0 20px}
  .wk-h h2{font-size:clamp(20px,2.4vw,26px);font-weight:600;letter-spacing:-.02em;margin:0}
  .wk-h p{margin:0;color:var(--t2);font-size:15px;font-variant-numeric:tabular-nums lining-nums}
  .row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.6vw,20px)}
  .wk.first .row{grid-template-columns:minmax(0,2.1fr) repeat(2,minmax(0,1fr));grid-template-rows:auto auto}
  .wk.first .po:first-child{grid-row:span 2}
  .po{margin:0}
  .po a{display:block;border:1px solid var(--line);background:var(--paper-2);line-height:0}
  .po a:hover,.po a:focus-visible{border-color:var(--t1)}
  .po img{width:100%;height:auto;aspect-ratio:4/5;display:block}
  .po figcaption{font-size:13.5px;color:var(--t2);margin-top:8px}
  .empty{color:var(--t2);padding:32px 0}
  @media(max-width:760px){
    .row,.wk.first .row{grid-template-columns:repeat(2,minmax(0,1fr))}
    .wk.first .po:first-child{grid-column:span 2;grid-row:auto}
  }
</style>
</head>
<body>
<a href="#main" class="skip" data-t="skip">Skip to content</a>
<div data-nav></div>

<main id="main">
  <section class="page-head first">
    <div class="wrap">
      <p class="page-kicker"><span data-t="kicker">Every Friday</span></p>
      <h1 class="page-h1" data-t="h1">Posters</h1>
      <p class="page-lead" data-t="lead">Every Friday the week in Swiss case law is drawn five ways, one design per language. Same week, same numbers.</p>
      <noscript><p class="page-lead">The archive is listed in <a href="/posters/index.json">/posters/index.json</a>; the newest posters are at <a href="/posters/latest/en.webp">/posters/latest/</a>.</p></noscript>
    </div>
  </section>
  <section>
    <div class="wrap" id="weeks"><p class="empty" data-t="loading">Loading the archive.</p></div>
  </section>
</main>

<div data-foot></div>

<script src="/static/js/site.js?v=3"></script>
<script>
OCL.init({
  active:'posters',
  i18n:{
    de:{kicker:'Jeden Freitag',h1:'Poster',lead:'Jeden Freitag wird die Woche der Schweizer Rechtsprechung fünfmal gezeichnet, ein Entwurf pro Sprache. Dieselbe Woche, dieselben Zahlen.',week:'Woche',added:'neue Entscheide',loading:'Das Archiv wird geladen.',failed:'Das Archiv konnte nicht geladen werden.',open:'Poster in voller Grösse öffnen'},
    fr:{kicker:'Chaque vendredi',h1:'Affiches',lead:'Chaque vendredi, la semaine de la jurisprudence suisse est dessinée de cinq manières, un dessin par langue. La même semaine, les mêmes chiffres.',week:'Semaine',added:'nouvelles décisions',loading:'Chargement des archives.',failed:'Les archives n’ont pas pu être chargées.',open:'Ouvrir l’affiche en grand'},
    it:{kicker:'Ogni venerdì',h1:'Manifesti',lead:'Ogni venerdì la settimana della giurisprudenza svizzera viene disegnata in cinque modi, un disegno per lingua. La stessa settimana, gli stessi numeri.',week:'Settimana',added:'nuove decisioni',loading:'Caricamento dell’archivio.',failed:'Impossibile caricare l’archivio.',open:'Apri il manifesto a grandezza intera'},
    rm:{kicker:'Mintga venderdi',h1:'Placats',lead:'Mintga venderdi vegn l’emna da la giurisprudenza svizra dissegnada en tschintg modas, in dissegn per lingua. La medema emna, las medemas cifras.',week:'Emna',added:'novas decisiuns',loading:'L’archiv vegn chargià.',failed:'L’archiv n’ha betg pudì vegnir chargià.',open:'Avrir il placat en grondezza cumplaina'},
    en:{kicker:'Every Friday',h1:'Posters',lead:'Every Friday the week in Swiss case law is drawn five ways, one design per language. Same week, same numbers.',week:'Week',added:'new decisions',loading:'Loading the archive.',failed:'The archive could not be loaded.',open:'Open the poster at full size'}
  },
  onReady:function(O){
    var NAMES={de:'Deutsch',fr:'Français',it:'Italiano',rm:'Rumantsch',en:'English'};
    var box=document.getElementById('weeks');
    function day(iso){var p=iso.split('-');return (+p[2])+'.'+(+p[1])+'.';}
    fetch('/posters/index.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(m){
      box.innerHTML=(m.weeks||[]).map(function(w,i){
        var parts=w.week.split('-W');
        // the reader's own language leads; the rest keep the order of the national languages
        var ps=w.posters.slice().sort(function(a,b){return (b.lang===O.lang)-(a.lang===O.lang);});
        return '<section class="wk'+(i===0?' first':'')+'"><div class="wk-h"><h2>'+O.esc(O.t('week'))+' '+(+parts[1])+', '+O.esc(parts[0])+'</h2>'+
          '<p>'+day(w.from)+'–'+day(w.to)+' &nbsp; '+O.fmt(w.added)+' '+O.esc(O.t('added'))+'</p></div><div class="row">'+
          ps.map(function(p){
            var first=(p.caption||'').split('\n')[0];
            return '<figure class="po"><a href="/posters/'+O.esc(p.file)+'" lang="'+O.esc(p.lang)+'" title="'+O.esc(O.t('open'))+'">'+
              '<img src="/posters/'+O.esc(p.file)+'" width="1080" height="1350" loading="'+(i===0?'eager':'lazy')+'" decoding="async" alt="'+O.esc(first)+'"></a>'+
              '<figcaption>'+O.esc(NAMES[p.lang]||p.lang)+'</figcaption></figure>';
          }).join('')+'</div></section>';
      }).join('')||'<p class="empty">'+O.esc(O.t('failed'))+'</p>';
    }).catch(function(){box.innerHTML='<p class="empty">'+O.esc(O.t('failed'))+'</p>';});
  }
});
</script>
</body>
</html>
