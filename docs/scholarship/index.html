<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open-access legal scholarship — OpenCaseLaw</title>
<meta name="description" content="Search more than 44,000 open-access Swiss legal publications from 24 sources (BORIS, e-periodica, ZHAW, ZORA and more). Full-text where licensing allows. Free, no account.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://opencaselaw.ch/scholarship/">
<link rel="alternate" hreflang="de" href="https://opencaselaw.ch/scholarship/?lang=de">
<link rel="alternate" hreflang="fr" href="https://opencaselaw.ch/scholarship/?lang=fr">

<link rel="alternate" hreflang="rm" href="https://opencaselaw.ch/scholarship/?lang=rm">
<link rel="alternate" hreflang="en" href="https://opencaselaw.ch/scholarship/?lang=en">
<link rel="alternate" hreflang="x-default" href="https://opencaselaw.ch/scholarship/">
<link rel="icon" href="/favicon.svg">

<link rel="preconnect" href="https://mcp.opencaselaw.ch">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<link rel="stylesheet" href="/static/css/site.css?v=3">
<style>
  .s-form{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;margin:36px 0 0}
  .s-input{flex:1 1 320px;min-width:240px;padding:13px 16px;font:inherit;font-size:16px;background:var(--paper);border:1px solid var(--line);border-radius:10px;color:var(--t1)}
  .s-input:focus{outline:2px solid var(--red);outline-offset:1px}
  .examples{margin:18px 0 0;font-size:13.5px;color:var(--t2);line-height:2}
  .examples .lbl{color:var(--t3);font-family:var(--f-mono);font-size:12px;margin-right:6px}
  .examples a{color:var(--t2);text-decoration:none;margin-right:16px;border-bottom:1px dotted var(--t3);padding-bottom:1px}
  .examples a:hover{color:var(--t1);border-color:var(--t1)}
  .s-meta{font-family:var(--f-mono);font-size:12.5px;color:var(--t3);margin:28px 0 18px}
  .r-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
  .pub{border:1px solid var(--line);border-radius:12px;padding:20px 22px;transition:border-color .16s var(--ease),transform .16s,box-shadow .16s;background:var(--paper)}
  .pub:hover{border-color:var(--t3);transform:translateY(-1px);box-shadow:0 10px 26px var(--line-2)}
  .pub-title{font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.01em;margin:0 0 7px}
  .pub-title a{color:var(--t1);text-decoration:none}
  .pub-title a:hover{text-decoration:underline;text-underline-offset:2px}
  .pub-authors{font-size:14px;color:var(--t2);margin:0 0 9px}
  .pub-snippet{font-size:13.5px;color:var(--t2);line-height:1.55;margin:0 0 10px}
  .pub-snippet mark{background:color-mix(in srgb,var(--red) 18%,transparent);color:inherit;border-radius:2px;padding:0 2px}
  .pub-meta{font-family:var(--f-mono);font-size:11.5px;color:var(--t3);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .pub-src{color:var(--red)}
  .pub-lic{border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--t3)}
  .empty,.error{padding:56px 16px;text-align:center;color:var(--t2)}
  .empty strong{color:var(--t1);display:block;margin-bottom:8px;font-size:18px;font-weight:600}
  .error{color:var(--red)}
  .skeleton{background:var(--paper-2);border:1px solid var(--line-2);border-radius:12px;height:104px;margin-bottom:12px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:.9}}
  @media(prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body>
<a href="#main" class="skip" data-t="skip">Skip to content</a>
<div data-nav></div>

<main id="main">
  <section class="page-head first">
    <div class="wrap" style="max-width:760px;margin:0 auto">
      <p class="page-kicker"><b data-t="sc_kick">Open access</b></p>
      <h1 class="page-h1" data-t="sc_h1">Legal scholarship</h1>
      <p class="page-lead" data-t="sc_lede">Full-text search over <span id="sc-count">more than 44,000</span> open-access Swiss legal publications from <span id="sc-sources">24</span> sources — BORIS, e-periodica, ZHAW, ZORA and more. Full text where licensing allows.</p>
    </div>
  </section>

  <section class="wrap" style="max-width:760px;margin:0 auto;padding-bottom:clamp(64px,9vw,112px)">
    <form class="s-form" id="form" role="search" aria-label="Search legal scholarship">
      <input class="s-input" type="search" id="q" name="q" autocomplete="off" aria-label="Search query">
      <button type="submit" class="btn btn-primary" data-t="sc_submit">Search</button>
    </form>
    <p class="examples">
      <span class="lbl" data-t="sc_try">Try:</span>
      <a href="?q=Datenschutz">Datenschutz</a>
      <a href="?q=Tierversuch">Tierversuch</a>
      <a href="?q=protection+des+donn%C3%A9es">protection des données</a>
      <a href="?q=Mietrecht">Mietrecht</a>
    </p>
    <div class="s-meta" id="meta" hidden></div>
    <ul class="r-list" id="results" aria-live="polite"></ul>
    <p class="s-meta" id="sources-note" style="margin-top:36px"></p>
  </section>
</main>

<div data-foot></div>
<script src="/static/js/site.js?v=1"></script>
<script>
OCL.init({
  active:'',
  i18n:{
    de:{sc_kick:'Open Access',sc_h1:'Rechtswissenschaftliche Literatur',sc_lede:'Volltextsuche über <span id="sc-count">mehr als 44 000</span> frei zugängliche Schweizer rechtswissenschaftliche Publikationen aus <span id="sc-sources">24</span> Quellen — BORIS, e-periodica, ZHAW, ZORA u. a. Volltext, soweit es die Lizenz erlaubt.',
      sc_submit:'Suchen',sc_try:'Versuchen Sie:',sc_ph:'z. B. Datenschutz · Mietrecht · responsabilité',
      m_searching:'Suche nach "{q}" …',m_count:'{n} Publikationen · {ms} ms',m_more:'{n} Publikationen (erste {shown}) · {ms} ms',
      r_no:'Keine Publikationen für "{q}"',r_noHint:'Versuchen Sie allgemeinere Begriffe oder eine andere Sprache.',r_untitled:'(ohne Titel)',
      e_failed:'Suche fehlgeschlagen: {msg}.',srcnote:'Quellen + Lizenzen: jede Publikation verweist auf ihre Originalquelle; Wiedergabe gemäss der jeweiligen Open-Access-Lizenz.'},
    fr:{sc_kick:'Libre accès',sc_h1:'Littérature juridique',sc_lede:'Recherche plein texte sur <span id="sc-count">plus de 44 000</span> publications juridiques suisses en libre accès, issues de <span id="sc-sources">24</span> sources — BORIS, e-periodica, ZHAW, ZORA, etc. Texte intégral selon la licence.',
      sc_submit:'Rechercher',sc_try:'Essayez :',sc_ph:'p. ex. protection des données · bail · Datenschutz',
      m_searching:'Recherche de "{q}" …',m_count:'{n} publications · {ms} ms',m_more:'{n} publications (premières {shown}) · {ms} ms',
      r_no:'Aucune publication pour "{q}"',r_noHint:'Essayez des termes plus généraux ou une autre langue.',r_untitled:'(sans titre)',
      e_failed:'Échec de la recherche : {msg}.',srcnote:'Sources + licences : chaque publication renvoie à sa source d\'origine ; reproduction selon la licence libre concernée.'},
    it:{sc_kick:'Accesso aperto',sc_h1:'Letteratura giuridica',sc_lede:'Ricerca a testo pieno su <span id="sc-count">oltre 44 000</span> pubblicazioni giuridiche svizzere ad accesso aperto da <span id="sc-sources">24</span> fonti — BORIS, e-periodica, ZHAW, ZORA e altre. Testo integrale secondo la licenza.',
      sc_submit:'Cerca',sc_try:'Provate:',sc_ph:'p. es. protezione dei dati · locazione · Datenschutz',
      m_searching:'Ricerca di "{q}" …',m_count:'{n} pubblicazioni · {ms} ms',m_more:'{n} pubblicazioni (prime {shown}) · {ms} ms',
      r_no:'Nessuna pubblicazione per "{q}"',r_noHint:'Provate termini più generici o un\'altra lingua.',r_untitled:'(senza titolo)',
      e_failed:'Ricerca non riuscita: {msg}.',srcnote:'Fonti + licenze: ogni pubblicazione rimanda alla fonte originale; riproduzione secondo la rispettiva licenza ad accesso aperto.'},
    rm:{sc_kick:'Access avert',sc_h1:'Litteratura giuridica',sc_lede:'Tschertga da text cumplet sur <span id="sc-count">passa 44 000</span> publicaziuns giuridicas svizras cun access avert da <span id="sc-sources">24</span> funtaunas — BORIS, e-periodica, ZHAW, ZORA e dapli. Text cumplet uschè ditg che la licenza permetta.',
      sc_submit:'Tschertgar',sc_try:'Empruvai:',sc_ph:'p. ex. protecziun da datas · fittanza · Datenschutz',
      m_searching:'Tschertga da "{q}" …',m_count:'{n} publicaziuns · {ms} ms',m_more:'{n} publicaziuns (las emprimas {shown}) · {ms} ms',
      r_no:'Naginas publicaziuns per "{q}"',r_noHint:'Empruvai noziuns pli generalas u in\'autra lingua.',r_untitled:'(senza titel)',
      e_failed:'La tschertga è fallida: {msg}.',srcnote:'Funtaunas + licenzas: mintga publicaziun renviescha a sia funtauna originala; reproducziun tenor la respectiva licenza d\'access avert.'},
    en:{sc_kick:'Open access',sc_h1:'Legal scholarship',sc_lede:'Full-text search over <span id="sc-count">more than 44,000</span> open-access Swiss legal publications from <span id="sc-sources">24</span> sources — BORIS, e-periodica, ZHAW, ZORA and more. Full text where licensing allows.',
      sc_submit:'Search',sc_try:'Try:',sc_ph:'e.g. Datenschutz · data protection · responsabilité',
      m_searching:'Searching for "{q}"…',m_count:'{n} publications · {ms} ms',m_more:'{n} publications (first {shown}) · {ms} ms',
      r_no:'No publications for "{q}"',r_noHint:'Try broader terms or another language.',r_untitled:'(untitled)',
      e_failed:'Search failed: {msg}.',srcnote:'Sources + licences: each publication links to its original source; reproduction per its respective open-access licence.'}
  },
  onReady:function(O){
    'use strict';
    function T(k,v){var s=O.t(k); if(v)for(var x in v)s=s.split('{'+x+'}').join(v[x]); return s;}
    var API='https://mcp.opencaselaw.ch/api/scholarship/search', LIMIT=30;
    var $=function(s){return document.querySelector(s);};
    document.getElementById('q').placeholder=O.t('sc_ph');
    document.getElementById('sources-note').textContent=O.t('srcnote');
    // Refine the hero copy's rounded static fallback with the live count once stats.json
    // loads (same convention as the homepage). Leaves the fallback in place on failure.
    fetch('/stats.json?v='+Math.floor(Date.now()/60000)).then(function(r){return r.ok?r.json():null;}).then(function(s){
      if(!s||!s.corpus||!s.corpus.scholarship_publications)return;
      var cEl=$('#sc-count'),sEl=$('#sc-sources');
      if(cEl)cEl.textContent=O.fmt(s.corpus.scholarship_publications);
      if(sEl&&s.corpus.scholarship_by_source)sEl.textContent=String(Object.keys(s.corpus.scholarship_by_source).length);
    }).catch(function(){});
    function el(tag,props,kids){var n=document.createElement(tag);if(props)for(var k in props){if(k==='class')n.className=props[k];else if(k==='text')n.textContent=props[k];else if(k==='href')n.setAttribute('href',props[k]);else if(k.indexOf('aria-')===0||k==='rel'||k==='target')n.setAttribute(k,props[k]);else n[k]=props[k];}if(kids)kids.forEach(function(c){if(c==null)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c);});return n;}
    function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
    function safeUrl(u){try{var p=new URL(u,location.href);return (p.protocol==='http:'||p.protocol==='https:')?p.href:'#';}catch(e){return '#';}}
    function snippet(text){var box=el('p',{class:'pub-snippet'});var parts=String(text).split(/>>>|<<</);
      parts.forEach(function(p,i){if(i%2===1){box.appendChild(el('mark',{text:p}));}else if(p){box.appendChild(document.createTextNode(p));}});return box;}
    function buildPub(r){
      var rawUrl=r.url||r.pdf_url||'';
      // Closed-access records carry no URL. safeUrl('') resolves against location.href and
      // "succeeds" with the current page itself, so an anchor here would silently loop back —
      // render the title as plain text instead.
      var titleEl=rawUrl?el('a',{href:safeUrl(rawUrl),target:'_blank',rel:'noopener',text:r.title||T('r_untitled')}):el('span',{text:r.title||T('r_untitled')});
      var title=el('h2',{class:'pub-title'},[titleEl]);
      var bits=[];
      if(r.authors)bits.push(r.authors);
      if(r.journal)bits.push(r.journal);
      if(r.year)bits.push(String(r.year));
      var authors=bits.length?el('p',{class:'pub-authors',text:bits.join(' · ')}):null;
      var meta=el('div',{class:'pub-meta'});
      if(r.source)meta.appendChild(el('span',{class:'pub-src',text:r.source}));
      if(r.language)meta.appendChild(el('span',{text:(r.language||'').toUpperCase()}));
      if(r.pub_type)meta.appendChild(el('span',{text:r.pub_type}));
      if(r.license)meta.appendChild(el('span',{class:'pub-lic',text:r.license}));
      var kids=[title]; if(authors)kids.push(authors); if(r.snippet)kids.push(snippet(r.snippet)); kids.push(meta);
      return el('li',{class:'pub'},kids);
    }
    function skeleton(){var list=$('#results');clear(list);for(var i=0;i<5;i++)list.appendChild(el('li',{class:'skeleton','aria-hidden':'true'}));}
    function setMeta(t){var m=$('#meta');m.hidden=false;m.textContent=t;}
    function runSearch(q){
      if(!q){clear($('#results'));$('#meta').hidden=true;return;}
      skeleton();setMeta(T('m_searching',{q:q}));
      var url=new URL(API);url.searchParams.set('query',q);url.searchParams.set('limit',String(LIMIT));
      var t0=performance.now();
      fetch(url,{cache:'no-store',headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw new Error('API '+r.status);return r.json();}).then(function(data){
        var ms=Math.round(performance.now()-t0);var rs=data.results||[];var n=(data.count!=null)?data.count:rs.length;
        var list=$('#results');clear(list);
        if(!rs.length){list.appendChild(el('li',{class:'empty'},[el('strong',{text:T('r_no',{q:q})}),T('r_noHint')]));$('#meta').hidden=true;return;}
        setMeta(rs.length<n?T('m_more',{n:O.fmt(n),shown:rs.length,ms:ms}):T('m_count',{n:O.fmt(n),ms:ms}));
        rs.forEach(function(r){list.appendChild(buildPub(r));});
      }).catch(function(e){var list=$('#results');clear(list);list.appendChild(el('li',{class:'error',text:T('e_failed',{msg:e.message})}));$('#meta').hidden=true;});
    }
    function init(){var q=new URLSearchParams(location.search).get('q')||'';$('#q').value=q;if(q)runSearch(q);}
    $('#form').addEventListener('submit',function(e){e.preventDefault();var q=$('#q').value.trim();var p=new URLSearchParams();if(q)p.set('q',q);history.pushState({q:q},'',q?'?'+p:location.pathname);runSearch(q);});
    window.addEventListener('popstate',init);
    init();
  }
});
</script>
</body>
</html>
