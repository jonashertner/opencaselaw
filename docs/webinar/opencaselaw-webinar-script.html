<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
:root{

  --red:#c03020;--grn:#2a7848;--gold:#a07010;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

.sl{position:absolute;inset:0;display:flex;align-items:flex-start;
  padding:52px 9% 56px;opacity:0;transition:opacity .4s;pointer-events:none}
.sl.on{opacity:1;pointer-events:auto}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fd{opacity:0}.sl.on .fd{animation:rise .4s ease forwards}

/* Terminal */
.term{background:#141412;border-radius:12px;padding:22px 28px;
  font:400 15px/1.8 var(--mono);color:#71716b;-webkit-font-smoothing:auto}
.term .c{color:#d4a74a}.term .v{color:#e2e2da}.term .d{color:#48483e}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;height:44px;display:flex;align-items:center;
  justify-content:space-between;padding:0 32px;z-index:99;
  background:linear-gradient(transparent 0%,var(--bg) 40%)}
.nb{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font:500 14px var(--sans);color:var(--mute);transition:.15s}
.nb:hover{color:var(--fg)}.nb:disabled{opacity:.15;cursor:default}
.dots{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--line);cursor:pointer;transition:.25s}
.dot.on{width:32px;background:var(--red);border-radius:4px}
.cz{position:fixed;top:0;bottom:44px;width:12%;z-index:50}
</style>

function App(){
