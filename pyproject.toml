[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-caselaw-scrapers"
version = "0.1.0"
description = "Scraping framework for Swiss federal and cantonal court decisions"
readme = "PYPI.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Jonas Hertner"}]
keywords = ["Switzerland", "case law", "legal research", "scraping", "MCP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "playwright>=1.58.0",
    "pydantic>=2.0",
    "pyarrow>=14.0",
    "huggingface-hub>=0.20",
    "zstandard>=0.22",
]

[project.urls]
Homepage = "https://opencaselaw.ch"
Documentation = "https://opencaselaw.ch"
Repository = "https://github.com/jonashertner/opencaselaw"
Issues = "https://github.com/jonashertner/opencaselaw/issues"
LinkedIn = "https://www.linkedin.com/company/opencaselaw-ch/"

[project.optional-dependencies]
crypto = ["pycryptodome>=3.20"]
# pdfplumber is a runtime dependency of search_stack/build_botschaft_corpus.py
# (hard) and scrapers/practice/base.py (fallback); both import it lazily, so a
# clean install without it fails only mid-run.
pdf = ["pymupdf>=1.27.2.2", "pdfplumber>=0.11"]
# `api` covers the MCP server + FastAPI gateway. mcp_server.py and
# web_api/main.py import these at module load, so anyone running them
# off the wheel needs them present.
api = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "mcp>=1.28.1,<2",
    "python-dotenv>=1.0",
]
# Provider SDKs for the FastAPI orchestrator (web_api/providers/*.py).
# Each adapter imports its SDK lazily inside __init__, so installing
# subset-of-providers is supported, but the umbrella `all` extra
# should pull them all in.
providers = [
    "anthropic>=0.40",
    "google-genai>=0.3",
    "openai>=1.40",
]
semantic = ["sentence-transformers>=3.0", "sqlite-vec>=0.1.6", "onnxruntime>=1.24.3"]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0", "ruff>=0.1", "openapi-spec-validator>=0.7"]
all = ["swiss-caselaw-scrapers[crypto,pdf,api,providers,semantic,dev]"]

[tool.setuptools.packages.find]
include = [
    "scrapers*",
    "search_stack*",
    "quality*",
    "web_api*",
    "study*",
]

[tool.setuptools]
py-modules = [
    "appeal_extract",
    "backfill_bger_chambers",
    "backfill_canonical_identity",
    "base_scraper",
    "branch_map",
    "build_fts5",
    "cli_ch",
    "coverage_report",
    "db_schema",
    "decision_widget",
    "derive_from_text",
    "docket_aliases",
    "decision_ref",
    "reference_parser",
    "ecli",
    "ecthr_docket",
    "export_parquet",
    "exports",
    "fts5_server",
    "health_alerts",
    "health_metrics",
    "incapsula_bypass",
    "integrity",
    "law_widget",
    "mcp_server",
    "models",
    "pipeline",
    "proceeding_map",
    "research_contracts",
    "run_scraper",
    "seo_pages",
    "stripe_billing",
    "widget_runtime",
]

[project.scripts]
swiss-caselaw = "pipeline:main"
swiss-caselaw-gap-report = "coverage_report:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m \"not live and not manual\""
# Make project root importable so tests/qc/ can import the `quality`
# package (pytest only adds testpath dirs to sys.path by default).
pythonpath = [".", "clients/python/src"]
# scripts/ holds ad-hoc diagnostic scripts (some named *_test.py or test_*.py)
# that aren't pytest tests. Real tests live in tests/, plus a set of
# mission-critical OFFLINE suites historically parked at the repo root (dedup,
# completeness guards, citation extraction, schema, publish-step ordering) that
# testpaths=["tests"] had silently orphaned from `make test` and CI. The live_*
# root suites are intentionally NOT listed (they require network).
testpaths = [
    "tests",
    "clients/python/tests",
    "test_build_fts5_quality.py",
    "test_entscheidsuche_ingest_dedup.py",
    "test_runtime_completeness_guards.py",
    "test_reference_extraction.py",
    "test_schema.py",
    "test_publish_order.py",
]
norecursedirs = ["scripts", "web_ui", "artifacts", "benchmarks", ".claude", ".superpowers"]
markers = [
    "live: requires live network/system interaction; excluded from default pytest runs",
    "manual: diagnostic/manual test; excluded from default pytest runs",
]
