# ─────────────────────────────────────────────────────────────────────────
#  OpenCaseLaw — privacy-respecting two-tier logging
# ─────────────────────────────────────────────────────────────────────────
#  Tier 1  tier1.log   contains IPs + UAs; 72h hot, then shredded.
#          Purpose: abuse / DDoS response only (legitimate-interest basis).
#  Tier 2  tier2.log   class-level only (no IPs, no UAs, no queries);
#          14 days, rolled up nightly into analytics.db, then deleted.
#
#  Deploy: include this file from the `http { }` block in /etc/nginx/nginx.conf
#          via  `include /etc/nginx/conf.d/ocl-logging.conf;`  and then
#          reference $client_class / $endpoint_class from any server{} block
#          via `access_log /var/log/nginx/tier2.log tier2;`.
# ─────────────────────────────────────────────────────────────────────────

# ── Classify User-Agent → client class (at log time, in nginx) ───────────
# IMPORTANT: bots must be matched BEFORE browsers. Crawlers like Googlebot
# spoof Mozilla/Chrome in their UA strings, so a naive "chrome first"
# ordering would classify every Googlebot hit as a browser. The bot
# patterns below come first deliberately.
map $http_user_agent $client_class {
    default                                      other;

    # ── Crawlers first (they spoof browser UAs) ──────────────────────────
    "~*googlebot"                                bot_google;
    "~*bingbot"                                  bot_bing;
    "~*duckduckbot"                              bot_duckduck;
    "~*yandexbot"                                bot_yandex;
    "~*applebot"                                 bot_apple;
    "~*petalbot"                                 bot_petal;
    "~*yellowmcp|umai"                           bot_scanner;
    "~*seranking|ahrefs|semrush|mj12bot"         bot_seo;
    "~*bot/|bot\.|crawl|spider"                  bot_other;

    # ── Hosted LLM bridges (egress pools — counts are session-based) ─────
    "~*claude-user|claude-web|anthropic"         claude_hosted;
    "~*chatgpt|openai|gpt-[45]"                  chatgpt;

    # ── Local LLM clients (IP ≈ user) ────────────────────────────────────
    "~*claude.*desktop"                          claude_desktop;
    "~*claude.*ios"                              claude_mobile;
    "~*claude"                                   claude_other;
    "~*cursor"                                   cursor;
    "~*windsurf"                                 windsurf;
    "~*copilotstudio"                            copilot_studio;
    "~*gemini"                                   gemini_cli;

    # ── Scripts / developers ─────────────────────────────────────────────
    "~*mcp.*python"                              mcp_script;
    "~*python-httpx"                             python_script;
    "~*python-requests"                          python_script;
    "~*python-urllib"                            python_script;
    "~*^python"                                  python_script;
    "~*node-fetch|undici"                        node_script;
    "~*go-http-client"                           go_script;
    "~*curl/"                                    curl;
    "~*wget/"                                    wget;

    # ── Word add-in (identified by X-Client header, see below) ───────────
    "~*word-addin|officeaddin"                   word_addin;

    # ── Browsers (mostly SEO page visitors) ──────────────────────────────
    "~*trident"                                  browser_ie;
    "~*edge/"                                    browser_edge;
    "~*firefox/"                                 browser_firefox;
    "~*chrome/"                                  browser_chrome;
    "~*safari/"                                  browser_safari;
    "~*mozilla"                                  browser_other;

    "-"                                          empty;
}

# The Word add-in ships an explicit X-Client header. Prefer that over the
# generic IE/Trident UA so we can distinguish add-in traffic from real IE.
map $http_x_client $client_class_final {
    default         $client_class;
    "word-addin"    word_addin;
}

# ── Classify path → endpoint class ───────────────────────────────────────
# Collapses IDs and query strings so the log line carries no semantic data.
map $uri $endpoint_class {
    default                                  other;

    # MCP transport surfaces
    "/"                                      mcp_root;
    "/sse"                                   mcp_sse;
    "~^/messages/"                           mcp_messages;
    "/health"                                health;

    # REST API — bucketed per tool
    "/api/decisions"                         rest_search_decisions;
    "~^/api/decisions/[^/]+$"                rest_get_decision;
    "~^/api/case-brief/"                     rest_case_brief;
    "/api/courts"                            rest_list_courts;
    "/api/leading-cases"                     rest_leading_cases;
    "/api/doctrine"                          rest_doctrine;
    "/api/laws/search"                       rest_search_laws;
    "~^/api/laws/"                           rest_get_law;
    "/api/legislation/search"                rest_search_legislation;
    "~^/api/legislation/"                    rest_get_legislation;
    "~^/api/commentaries/search"             rest_search_commentaries;
    "~^/api/commentaries/"                   rest_get_commentary;
    "~^/api/citations/"                      rest_citations;
    "~^/api/appeal-chain/"                   rest_appeal_chain;
    "~^/api/legal-trend"                     rest_legal_trend;
    "~^/api/exam-question"                   rest_exam_question;
    "~^/api/mock-decision"                   rest_mock_decision;
    "~^/api/statistics"                      rest_statistics;
    "~^/api/billing"                         rest_billing;
    "~^/api/"                                rest_other;

    # Public site
    "~^/entscheid/"                          seo_decision_page;
    "/robots.txt"                            seo_robots;
    "~^/sitemap"                             seo_sitemap;
    "~^/\.well-known"                        wellknown;
}

# ── Install-cohort header (Word add-in only) ─────────────────────────────
# Truncate to 8 hex chars at log time so it never exceeds a 32-bit space.
# We strictly do NOT log raw install IDs — only the client-side monthly
# hash `SHA256(install_id + YYYY-MM)[:8]`.
map $http_x_install_cohort $install_cohort_short {
    default        "-";
    "~^([0-9a-f]{8})"   $1;
}

# ── Log formats ──────────────────────────────────────────────────────────
# Tier 1: IPs + UA, 72h retention, abuse response only.
log_format tier1 '$remote_addr $time_iso8601 '
                 '"$request_method $uri" $status $request_time '
                 '"$http_user_agent"';

# Tier 2: class-level only. No IPs. No UAs. No query strings. No referer.
# This file is structurally incapable of identifying a person and can be
# retained for 14 days without any privacy concern.
log_format tier2 '$time_iso8601 $client_class_final $endpoint_class '
                 '$request_method $status $request_time $body_bytes_sent '
                 '$install_cohort_short';

# ─────────────────────────────────────────────────────────────────────────
#  To activate, add to your server{} block (or nginx.conf http{} block):
#
#      access_log /var/log/nginx/tier1.log tier1;
#      access_log /var/log/nginx/tier2.log tier2;
#
#  Both logs are written in parallel. Tier 1 has a 72h logrotate + shred
#  policy (see ops/logrotate/ocl-tier1). Tier 2 is consumed nightly by
#  scripts/rollup_analytics.py, which writes aggregates to analytics.db
#  and then logrotate removes the raw file after 14 days.
# ─────────────────────────────────────────────────────────────────────────

# Tier 3 (tier3.log: tier-2 fields plus a Swiss-university label derived
# from the client's IP range) was removed 2026-11-10. Nothing read the file,
# and the privacy page (docs/datenschutz/) did not describe it. The vhost no
# longer references the format; do not reintroduce an IP-derived label
# without describing it there first.


# Legacy cleartext port 8765 — instrumentation, added 2026-08-26.
#
# The block is labelled "keep for backward compat, will deprecate" and proxies
# the full MCP surface over plain HTTP. Nothing in the codebase references it
# as a client target, but no existing log_format records $server_port or
# $scheme, so a cleartext request has been indistinguishable from a TLS one and
# past use cannot be excluded. This answers "is anyone actually on it, and what
# kind of client" before the port is closed.
#
# Deliberately NO $remote_addr, NO query string and (since 2026-11-10) NO
# User-Agent: the question is whether traffic exists and what class it is,
# and the client class answers that. The privacy page promises that full
# User-Agent strings are not kept beyond the 72-hour tier-1 log.
log_format legacy8765 '$time_iso8601 port=$server_port scheme=$scheme '
                      '"$request_method $uri" $status $request_time '
                      'class=$client_class_final';
