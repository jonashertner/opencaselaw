# Installed as /etc/systemd/journald.conf.d/ocl-retention.conf.
#
# The privacy page (docs/datenschutz/, "System and security logs") promises
# that the system journal deletes entries after 14 days at the latest. The
# journal holds SSH logins, firewall blocks and autoban events with IP
# addresses, so its retention must be bounded by time, not only by size.
#
# journald deletes an archived file once its newest entry is older than
# MaxRetentionSec, and MaxFileSec archives the active file at least daily.
# Worst case for an entry: 1 day in the active file + 12 days retention
# + up to 1 day until the next vacuum = 14 days.
[Journal]
MaxRetentionSec=12day
MaxFileSec=1day
